<script>
(function(){
  const root=document.currentScript.closest('[data-pid]');
  root.querySelector('.back').addEventListener('click',()=>dispatchEvent(new KeyboardEvent('keydown',{key:'Home'})));
  const c=root.querySelector('.copy');
  c.addEventListener('click',()=>{
    (navigator.clipboard?navigator.clipboard.writeText('cd 画板\npython3 server.py'):Promise.reject()).catch(()=>{});
    c.classList.add('done');setTimeout(()=>c.classList.remove('done'),1600);
  });
})();
</script>
