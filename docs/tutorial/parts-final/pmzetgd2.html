<h2 class="title"><span class="grad">用途二：</span>用网页代替 PPT</h2>
<p class="sub">你现在看的这套演示，<mark>就是</mark>用网页画板做出来的。</p>
<div class="col ppt">
  <h3>传统 PPT</h3>
  <ul><li>动画死板，只有几种模板</li><li>发给别人，对方要装软件</li><li>改个字，要找到原文件</li><li>放不了能点的交互</li><li>换个屏幕比例就变形</li></ul>
</div>
<div class="col us">
  <h3>网页画板</h3>
  <ul><li>CSS 动画，想怎么动就怎么动</li><li>发一个链接，浏览器就能看</li><li>预览里点字，直接改</li><li>按钮、复制、表单都能用</li><li>自动缩放，适配任何屏幕</li></ul>
</div>
<p class="keys">播放：<kbd>←</kbd> <kbd>→</kbd> 翻页 · <kbd>F</kbd> 全屏 · <kbd>Esc</kbd> 退出 · 支持 PageUp/PageDown 翻页笔</p>
