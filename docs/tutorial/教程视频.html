<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网页画板 · 使用教程</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;color:#f5f5f7}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--k,.5));overflow:hidden;background:#07070b}
#bgA,#bgB{position:absolute;width:1400px;height:1400px;border-radius:50%;filter:blur(60px);pointer-events:none}
#bgA{background:radial-gradient(closest-side,rgba(124,92,255,.32),transparent)}
#bgB{background:radial-gradient(closest-side,rgba(59,130,246,.22),transparent)}
#scene{position:absolute;inset:0}
.abs{position:absolute}
.grad{background:linear-gradient(100deg,#fff 5%,#c7b8ff 40%,#7C5CFF 70%,#3B82F6);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad2{background:linear-gradient(100deg,#b9a8ff,#7C5CFF 55%,#3B82F6);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:24px}
.chips .chip{position:static}
.center{left:0;right:0;text-align:center}
.caret{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-.12em;background:currentColor;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* 字幕 */
#cap{position:absolute;left:50%;bottom:26px;display:flex;align-items:center;gap:14px;padding:12px 26px 12px 14px;border-radius:30px;background:rgba(20,20,28,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.4);font-size:26px;font-weight:500;white-space:nowrap;opacity:0}
#cap b{min-width:38px;height:38px;padding:0 10px;border-radius:19px;display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff;background:linear-gradient(135deg,#7C5CFF,#3B82F6)}

/* 光标 */
#cur{position:absolute;left:0;top:0;width:34px;height:34px;opacity:0;z-index:50;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));pointer-events:none}
#ripple{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid rgba(10,132,255,.8);opacity:0;z-index:49;pointer-events:none}

/* 画板界面（浅色，和真实画板一致） */
.app{position:absolute;left:160px;top:60px;width:1600px;height:900px;border-radius:22px;overflow:hidden;color:#1d1d1f;background:#ececf0;background-image:radial-gradient(rgba(0,0,0,.09) 1.2px,transparent 1.2px);background-size:22px 22px;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.glass{position:absolute;background:rgba(255,255,255,.86);border-radius:16px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 6px 24px rgba(0,0,0,.07)}
.tb{left:12px;top:12px;right:12px;height:52px;display:flex;align-items:center;gap:14px;padding:0 14px}
.tb-ic{width:20px;height:16px;border:2px solid #3a3a3c;border-radius:4px}
.tb-title{min-width:220px;font-size:16px;font-weight:600}
.tb-title.ph{color:#a1a1a6}
.seg{display:flex;padding:3px;border-radius:10px;background:rgba(120,120,128,.14);font-size:14px;margin-left:220px}
.seg b{padding:5px 16px;border-radius:8px;font-weight:500}
.seg b.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tb-sp{flex:1}
.tb-zoom{font-size:14px;color:#3a3a3c}
.tb-ai{padding:7px 14px;border-radius:10px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#9f6bff,#6f5cff)}
.tb-play{padding:7px 14px;border-radius:10px;font-size:14px;background:rgba(120,120,128,.14)}
.lib{left:12px;top:76px;width:220px;bottom:12px;padding:12px}
.tabs{display:flex;padding:3px;border-radius:10px;background:rgba(120,120,128,.12);font-size:14px;margin-bottom:12px}
.tabs b{flex:1;text-align:center;padding:5px;border-radius:8px;font-weight:500}
.tabs b.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lib h6{margin:12px 6px 6px;font-size:12px;font-weight:500;color:#8e8e93}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{height:62px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#3a3a3c}
.tile svg{width:22px;height:22px;color:#0A84FF}
.tile.hot{background:rgba(10,132,255,.12)}
.cv{position:absolute;left:244px;top:76px;width:1042px;height:690px}
.ab-label{position:absolute;left:98px;top:90px;font-size:13px;color:#6e6e73}
.ab-label b{color:#1d1d1f;margin-right:6px}
.ab{position:absolute;left:98px;top:117px;width:1280px;height:720px;transform:scale(.66);transform-origin:0 0;background:#0B0B12;box-shadow:0 2px 20px rgba(0,0,0,.18)}
.insp{left:1298px;top:76px;width:290px;bottom:12px;padding:18px;font-size:14px}
.insp label{display:block;margin:16px 0 7px;font-size:12px;color:#8e8e93}
.insp label:first-child{margin-top:0}
.fld{min-height:36px;padding:8px 11px;border-radius:9px;background:rgba(120,120,128,.1);line-height:1.5;color:#1d1d1f;white-space:pre-wrap}
.fld.big{font-size:16px;font-weight:600}
.fld.area{min-height:64px}
.fld.on{box-shadow:0 0 0 3px rgba(10,132,255,.25);background:#fff}
.fld .caret{background:#0A84FF}
.row2{display:flex;gap:10px;align-items:center}
.sw{width:56px;height:30px;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.mh{display:flex;gap:12px;align-items:center}
.mh i{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:700;color:#0A84FF;background:rgba(10,132,255,.12)}
.mh small{display:block;font-size:12px;color:#8e8e93}
.dotl{display:flex;align-items:center;gap:7px;margin:14px 0 7px;font-size:13px;font-weight:500}
.dotl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--d)}
.strip{left:244px;top:778px;width:1042px;height:110px}
.th{position:absolute;top:18px;width:104px;height:58.5px;border-radius:7px;overflow:hidden;background:#0B0B12;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.th.on{box-shadow:0 0 0 2.5px #0A84FF}
.th .in{position:absolute;left:0;top:0;width:1280px;height:720px;transform:scale(.08125);transform-origin:0 0}
.th .in i{position:absolute;border-radius:14px;background:rgba(210,210,225,.22)}
.th em{position:absolute;right:4px;top:4px;width:10px;height:10px;border-radius:50%;background:#30d158;box-shadow:0 0 0 2px #fff}
.thn{position:absolute;top:82px;width:104px;text-align:center;font-size:12px;color:#8e8e93}
.addp{position:absolute;top:28px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:24px;color:#8e8e93;background:rgba(120,120,128,.1)}

/* 画布上的模块（深色背景线框） */
.m{position:absolute;border-radius:12px;background:#1d1d27;box-shadow:inset 0 0 0 1.5px rgba(210,210,225,.22)}
.m.sel{box-shadow:inset 0 0 0 1.5px rgba(210,210,225,.22),0 0 0 3px #0A84FF}
.m .badge{position:absolute;left:-14px;top:-14px;min-width:32px;height:32px;padding:0 8px;border-radius:16px;display:grid;place-items:center;font-size:17px;font-weight:600;color:#fff;background:#6e6e78;box-shadow:0 0 0 3px #0B0B12;z-index:2}
.m.sel .badge{background:#0A84FF}
.mc{position:absolute;inset:0;overflow:hidden;border-radius:inherit;display:flex;flex-direction:column;justify-content:center;padding:0 22px;color:#f5f5f7}
.mc .h{font-size:min(80px,60cqh);font-weight:800;letter-spacing:-1px;white-space:nowrap}
.m.t-heading .mc{container-type:size}
.mc .p{font-size:24px;line-height:1.4;color:rgba(235,235,245,.75)}
.mc .sk{height:12px;margin:6px 0;border-radius:6px;background:rgba(210,210,225,.2)}
.mc .btn{align-self:stretch;text-align:center;font-size:22px;font-weight:600}
.t-button{background:#3a3a48}
.mc .bx{text-align:center;font-size:22px;line-height:1.5;color:rgba(235,235,245,.7);white-space:pre-line}
.mc svg{align-self:center;width:64px;height:64px;color:rgba(210,210,225,.55)}
.mc .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:18px 0}
.mc .grid i{aspect-ratio:1;border-radius:10px;background:rgba(210,210,225,.14)}
.mc .li{display:flex;align-items:center;gap:14px;height:56px;border-bottom:1px solid rgba(210,210,225,.1)}
.mc .li i{width:30px;height:30px;border-radius:50%;background:rgba(210,210,225,.18)}
.mc .li s{flex:1;height:10px;border-radius:5px;background:rgba(210,210,225,.16)}
.t-search{border-radius:30px}
.mc .srch{display:flex;align-items:center;gap:14px;font-size:22px;color:rgba(235,235,245,.75)}

/* AI 命令面板和忙碌提示 */
.pal{position:absolute;left:370px;top:170px;width:620px;padding:12px;border-radius:20px;background:rgba(255,255,255,.92);backdrop-filter:blur(30px);box-shadow:0 30px 80px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1);z-index:5}
.pal .q{display:flex;align-items:center;gap:12px;height:50px;padding:0 12px;font-size:18px;color:#a1a1a6;border-bottom:1px solid rgba(0,0,0,.07);margin-bottom:8px}
.pal .q svg{width:22px;height:22px;color:#7C5CFF}
.pal .it{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:12px;font-size:17px}
.pal .it i{width:28px;height:28px;border-radius:8px;background:rgba(124,92,255,.14)}
.pal .it small{margin-left:auto;font-size:13px;color:#8e8e93}
.pal .it.on{color:#fff;background:linear-gradient(100deg,#7C5CFF,#3B82F6)}
.pal .it.on i{background:rgba(255,255,255,.25)} .pal .it.on small{color:rgba(255,255,255,.8)}
.busy{position:absolute;left:50%;top:22px;translate:-50% 0;display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:24px;font-size:16px;font-weight:500;color:#fff;background:rgba(30,30,40,.88);box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:6;white-space:nowrap}
.busy i{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sweep{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sweep i{position:absolute;top:0;bottom:0;width:260px;background:linear-gradient(90deg,transparent,rgba(124,92,255,.35),transparent)}

/* 嵌入的成品页面 */
.deck{position:absolute;overflow:hidden;border-radius:14px;background:#0B0B12;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.deck iframe{position:absolute;left:0;top:0;border:0;pointer-events:none}
.chip{position:absolute;padding:8px 18px;border-radius:20px;font-size:20px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.chip.g{background:linear-gradient(100deg,rgba(124,92,255,.85),rgba(59,130,246,.85));border:0}

/* 片头片尾 */
.logo{position:absolute;width:150px;height:150px;border-radius:38px;background:linear-gradient(135deg,#7C5CFF,#3B82F6);box-shadow:0 30px 80px rgba(124,92,255,.5),inset 0 1px 0 rgba(255,255,255,.3);display:grid;place-items:center}
.logo svg{width:84px;height:84px;color:#fff}
.term{position:absolute;border-radius:20px;background:rgba(22,22,32,.85);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.term .bar{height:44px;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.term .bar i{width:14px;height:14px;border-radius:50%}
.term pre{margin:0;padding:26px 30px;font:28px/1.8 "SF Mono",Menlo,Consolas,monospace}
.pain{position:absolute;padding:20px 32px;border-radius:22px;font-size:34px;font-weight:500;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);white-space:nowrap}

/* 播放控制 */
#ctl{position:fixed;left:0;right:0;bottom:0;padding:30px 24px 16px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;align-items:center;gap:16px;font-size:13px;color:rgba(255,255,255,.85);transition:opacity .4s;z-index:10}
body.idle #ctl{opacity:0}
body.clean #ctl{display:none}
#pp{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:15px;cursor:pointer}
#pp:hover{background:rgba(255,255,255,.28)}
#time{font-variant-numeric:tabular-nums;flex:none;width:96px}
#prog{position:relative;flex:1;height:22px;cursor:pointer}
#prog .tr{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
#prog .fl{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:linear-gradient(90deg,#7C5CFF,#3B82F6)}
#prog .tk{position:absolute;top:6px;width:2px;height:10px;background:rgba(255,255,255,.45)}
#prog .tip{position:absolute;bottom:26px;translate:-50% 0;padding:5px 10px;border-radius:7px;background:rgba(30,30,40,.95);white-space:nowrap;display:none}
#prog:hover .tip{display:block}
#chap{flex:none;width:200px;text-align:right;color:rgba(255,255,255,.6)}
#over{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:rgba(0,0,0,.35)}
#over.on{display:grid}
#over button{padding:16px 34px;border:0;border-radius:30px;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(100deg,#7C5CFF,#3B82F6);cursor:pointer;box-shadow:0 10px 40px rgba(124,92,255,.5)}
</style>
</head>
<body>
<div id="stage">
  <div id="bgA"></div><div id="bgB"></div>
  <div id="scene"></div>
  <div id="ripple"></div>
  <svg id="cur" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <div id="cap"><b></b><span></span></div>
</div>
<div id="ctl">
  <button id="pp" title="播放 / 暂停（空格）">❚❚</button>
  <span id="time"></span>
  <div id="prog"><div class="tr"></div><div class="fl"></div><div class="tip"></div></div>
  <span id="chap"></span>
</div>
<div id="over"><button>↻ 再看一遍</button></div>
<script>

const stage=document.getElementById('stage'),scene=document.getElementById('scene');
const el=(tag,cls,parent,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e};
const css=(e,o)=>{for(const k in o)e.style[k]=o[k];return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const out=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const typed=(s,t,a,b)=>{const c=[...s];return c.slice(0,Math.round(c.length*seg(t,a,b))).join('')};
const fade=(e,x,dy=24,sc)=>{e.style.opacity=x;e.style.transform=`translateY(${(1-x)*dy}px)`+(sc?` scale(${lerp(sc,1,x)})`:'')};
/* 开头淡入、结尾淡出：t 在 [a, b] 之间可见 */
const life=(t,a,b,d=.5)=>Math.min(out(seg(t,a,a+d)),b==null?1:1-seg(t,b-d,b));

/* ---------- 光标 ---------- */
const cur=document.getElementById('cur'),rip=document.getElementById('ripple');
/* keys: [[时间, x, y], ...]，clicks: 点击时刻 */
function cursor(t,keys,clicks=[]){
  if(!keys||!keys.length||t<keys[0][0]-.3||t>keys[keys.length-1][0]+1.2){cur.style.opacity=0;rip.style.opacity=0;return}
  let x=keys[0][1],y=keys[0][2];
  for(let i=0;i<keys.length-1;i++){const [t0,x0,y0]=keys[i],[t1,x1,y1]=keys[i+1];if(t>=t0){const k=io(seg(t,t0,t1));x=lerp(x0,x1,k);y=lerp(y0,y1,k)}}
  cur.style.opacity=life(t,keys[0][0]-.3,keys[keys.length-1][0]+1.2,.3);
  const c=clicks.find(c=>t>=c&&t<c+.5),down=clicks.some(c=>t>=c&&t<c+.15);
  cur.style.transform=`translate(${x}px,${y}px) scale(${down?.85:1})`;
  if(c!=null){const k=seg(t,c,c+.5);rip.style.opacity=1-k;rip.style.transform=`translate(${x}px,${y}px) scale(${lerp(.3,1.2,k)})`}else rip.style.opacity=0;
}
/* 元素中心在舞台上的坐标 */
function at(e,dx=.5,dy=.5){const r=e.getBoundingClientRect(),s=stage.getBoundingClientRect(),k=s.width/1920;return [(r.left-s.left+r.width*dx)/k,(r.top-s.top+r.height*dy)/k]}

function modHTML(type,text){
  switch(type){
    case 'heading':return text?`<div class="h">${esc(text)}</div>`:`<div class="sk" style="width:70%;height:30px"></div>`;
    case 'text':return text?`<div class="p">${esc(text)}</div>`:`<div class="sk"></div><div class="sk" style="width:80%"></div>`;
    case 'button':return `<div class="btn">${esc(text||'按钮')}</div>`;
    case 'image':return svg('图片');
    case 'box':return text?`<div class="bx">${esc(text)}</div>`:'';
    case 'search':return `<div class="srch">${svg('搜索栏','style="width:28px;height:28px;align-self:auto"')}${esc(text)}</div>`;
    case 'list':return `<div>${'<div class="li"><i></i><s></s></div>'.repeat(6)}</div>`;
    case 'grid':return `<div class="grid">${'<i></i>'.repeat(15)}</div>`;
  }
  return '';
}

/* ---------- 时间轴 ---------- */
const starts=[];let TOT=0;SC.forEach(s=>{starts.push(TOT);TOT+=s.d});
let T=0,playing=true,ci=-1,st=null,last=performance.now();
const capEl=document.getElementById('cap'),capB=capEl.querySelector('b'),capS=capEl.querySelector('span');
const q=new URLSearchParams(location.search);
if(q.has('clean'))document.body.classList.add('clean');
if(q.has('t'))T=clamp(+q.get('t')||0,0,TOT-.01);
function sceneAt(x){for(let i=SC.length-1;i>=0;i--)if(x>=starts[i])return i;return 0}
function render(){
  const i=sceneAt(T);
  if(i!==ci){ci=i;scene.innerHTML='';FR.clear();cur.style.opacity=0;rip.style.opacity=0;st=SC[i].build()||{};updChap()}
  const t=T-starts[i],s=SC[i];
  s.u(t,st);
  /* 字幕 */
  if(s.cap){capB.textContent=s.cap[0];capB.style.display=s.cap[0]?'':'none';capS.textContent=s.cap[1];const k=life(t,.3,s.d-.1,.4);capEl.style.opacity=k;capEl.style.transform=`translate(-50%,${(1-k)*20}px)`}else capEl.style.opacity=0;
  /* 背景光斑缓慢移动 */
  css(document.getElementById('bgA'),{left:300+Math.sin(T*.25)*240+'px',top:-500+Math.cos(T*.2)*160+'px'});
  css(document.getElementById('bgB'),{left:700+Math.cos(T*.18)*300+'px',top:200+Math.sin(T*.22)*180+'px'});
  /* 控制条 */
  document.querySelector('#prog .fl').style.width=T/TOT*100+'%';
  document.getElementById('time').textContent=fmt(T)+' / '+fmt(TOT);
}
const fmt=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
function updChap(){document.getElementById('chap').textContent=`${ci+1}/${SC.length} · ${SC[ci].name}`}
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){T+=dt;if(T>=TOT){T=TOT-.001;setPlay(false);document.getElementById('over').classList.add('on')}}
  render();requestAnimationFrame(loop);
}
function setPlay(v){playing=v;document.getElementById('pp').textContent=v?'❚❚':'▶';stage.querySelectorAll('*').forEach(e=>e.style.animationPlayState=v?'':'paused')}
function seek(x){T=clamp(x,0,TOT-.01);ci=-1;document.getElementById('over').classList.remove('on')}
function fit(){document.documentElement.style.setProperty('--k',Math.min(innerWidth/1920,innerHeight/1080))}
addEventListener('resize',fit);fit();

/* 进度条：章节刻度、点击跳转 */
const prog=document.getElementById('prog'),tip=prog.querySelector('.tip');
starts.forEach((s,i)=>{if(i)css(el('i','tk',prog),{left:s/TOT*100+'%'})});
prog.addEventListener('click',e=>{const r=prog.getBoundingClientRect();seek((e.clientX-r.left)/r.width*TOT)});
prog.addEventListener('mousemove',e=>{const r=prog.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;tip.style.left=x*100+'%';tip.textContent=SC[sceneAt(x*TOT)].name+' · '+fmt(x*TOT)});
document.getElementById('pp').onclick=()=>setPlay(!playing);
document.querySelector('#over button').onclick=()=>{seek(0);setPlay(true)};
addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();setPlay(!playing)}
  else if(e.key==='ArrowRight')seek(starts[Math.min(ci+1,SC.length-1)]);
  else if(e.key==='ArrowLeft')seek(T-starts[ci]>1?starts[ci]:starts[Math.max(ci-1,0)]);
  else if(e.key==='f'||e.key==='F')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
});
stage.addEventListener('click',()=>setPlay(!playing));
let idle;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>playing&&document.body.classList.add('idle'),2200)});
/* 逐帧渲染模式（?render=1）：外部录制程序调用 renderFrame(秒)，每一帧的画面只由时间决定 */
if(q.has('render')){
  document.body.classList.add('clean');playing=false;
  window.renderFrame=async x=>{
    T=x;render();
    const fs=[...FR];
    await Promise.race([Promise.all(fs.map(f=>f._ready)),new Promise(r=>setTimeout(r,8000))]);
    render();
    document.getAnimations().forEach(a=>{a.pause();a.currentTime=T*1000});
    fs.forEach(f=>{const d=f.contentDocument;if(d)d.getAnimations().forEach(a=>{a.pause();a.currentTime=Math.max(0,(T-f._t0)*1000)})});
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    return ci;
  };
  window.TOTAL=TOT;
}else requestAnimationFrame(loop);
</script>
