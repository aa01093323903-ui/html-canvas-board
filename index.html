}
function adoptSize(w,h){const P=doc.project;P.width=w;P.height=h;P.device=Object.keys(DEV).find(k=>DEV[k].w===w&&DEV[k].h===h)||'custom'}

// 在看不见的 iframe 里排一遍版：量高度、取背景色、识别结构
function measure(id,html,W,H,fixedH){
  return new Promise(done=>{
    const fr=document.createElement('iframe');let over=false;
    fr.setAttribute('sandbox','allow-same-origin');
    fr.style.cssText=`position:fixed;left:-30000px;top:0;width:${W}px;height:${H}px;border:0;visibility:hidden;pointer-events:none`;
    const fin=async()=>{
      if(over)return;over=true;
      const d=fr.contentDocument,sec=d&&d.querySelector('section');let r={height:fixedH||H,bg:null,modules:[]};
      try{
        await Promise.race([d.fonts.ready,new Promise(z=>setTimeout(z,1500))]);
        d.getAnimations().forEach(a=>{try{a.finish()}catch{a.cancel()}});
        const bg=e=>e&&toHex(d.defaultView.getComputedStyle(e).backgroundColor);
        const height=fixedH||Math.min(20000,Math.max(H,Math.ceil(sec.scrollHeight)));
        r={height,bg:bg(sec.querySelector(':scope > .pg-html'))||bg(sec.querySelector(':scope > .pg-html > .pg-body')),modules:wireFrom(sec,W,height)};
      }catch(e){console.warn('导入：排版测量失败',e)}
      fr.remove();done(r);
    };
    fr.onload=()=>setTimeout(fin,80);setTimeout(fin,8000);
    fr.srcdoc=`<!doctype html><html><head><meta charset="utf-8"><base href="${location.origin}/output/"><style>${DECK_CSS}</style></head><body><section class="slide active" data-pid="${id}" style="display:block;position:relative;left:0;top:0;transform:none;animation:none;box-shadow:none;width:${W}px;${fixedH?`height:${fixedH}px`:`min-height:${H}px`}">${html}</section></body></html>`;
    document.body.appendChild(fr);
  });
}
const WF_PRI={nav:0,footer:0,section:1,heading:2,button:3,image:4,video:4,chart:4,form:4,card:5,input:6,text:7,icon:8};
const WF_LEAF=new Set(['heading','text','button','image','icon','video','chart','input','nav','footer']);
function wireFrom(root,W,H){
  const win=root.ownerDocument.defaultView,R=root.getBoundingClientRect(),found=[];
  const kind=(c,t,w,h,st)=>{
    const cls=String(c.getAttribute('class')||'')+' '+(c.id||'');
    if(/^h[1-3]$/.test(t))return 'heading';
    if(t==='nav'||(t==='header'&&h<=160))return 'nav';
    if(t==='footer')return 'footer';
    if(t==='button'||(t==='input'&&/^(submit|button|reset)$/i.test(c.type))||(t==='a'&&/btn|button|cta/i.test(cls)))return 'button';
    if(t==='input'||t==='textarea'||t==='select')return 'input';
    if(t==='img'||t==='picture'||t==='svg')return w<=64&&h<=64?'icon':'image';
    if(t==='video'||t==='iframe')return 'video';
    if(t==='canvas')return 'chart';
    if(t==='form')return 'form';
    if(/^(p|blockquote|h[4-6]|pre|figcaption|dt|dd)$/.test(t))return 'text';
    if(h<240&&[...c.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))return 'text';
    if(!c.children.length&&/url\(/.test(st.backgroundImage)&&w>=80&&h>=60)return 'image';
    if(/(^|[\s_-])card($|[\s_])/i.test(cls))return 'card';
    if(w*h>=W*H*.9)return null; // 包住整页的外层容器
    if(/^(section|main|article|aside|header)$/.test(t)&&w>=W*.5&&h>=80)return 'section';
    if(w>=W*.9&&h>=120&&(toHex(st.backgroundColor)||/url\(/.test(st.backgroundImage)))return 'section';
    return null;
  };
  const visit=e=>{
    for(const c of e.children){
      const t=c.tagName.toLowerCase();
      if(/^(script|style|link|meta|template|noscript|br)$/.test(t))continue;
      const st=win.getComputedStyle(c);
      if(st.display==='none'||st.visibility==='hidden'||st.opacity==='0')continue;
      if(st.display==='contents'||c.classList.contains('pg-html')||c.classList.contains('pg-body')){visit(c);continue}
      const r=c.getBoundingClientRect(),x=Math.round(r.left-R.left),y=Math.round(r.top-R.top),w=Math.round(r.width),h=Math.round(r.height);
      if(w<6||h<6||x>=W||y>=H||x+w<=0||y+h<=0){if(st.overflow==='visible'&&t!=='svg')visit(c);continue}
      const type=kind(c,t,w,h,st);
      if(type){found.push({type,x,y,w,h,el:c,i:found.length});if(WF_LEAF.has(type))continue}
      if(t!=='svg')visit(c);
    }
  };
  visit(root);
  let keep=found;
  if(keep.length>40)keep=[...found].sort((a,b)=>WF_PRI[a.type]-WF_PRI[b.type]||b.w*b.h-a.w*a.h).slice(0,40).sort((a,b)=>a.i-b.i);
  return keep.map(f=>{
    const txt=norm(f.el.innerText||f.el.textContent).slice(0,80),alt=f.el.getAttribute('alt')||f.el.getAttribute('aria-label')||'';
    const x=clamp(f.x,0,W-20),y=clamp(f.y,0,H-20);
    return {id:uid(),no:++doc.seq,type:f.type,name:T[f.type].n,x,y,w:Math.min(f.w-(x-f.x),W-x),h:Math.min(f.h-(y-f.y),H-y),
      text:TEXTY.has(f.type)?(f.type==='input'?f.el.getAttribute('placeholder')||'':txt):'',
      notes:{...blankNotes(),content:TEXTY.has(f.type)||f.type==='section'?'':(alt||txt).slice(0,60)}};
  });
}

// 一个普通网页 → 一页
async function fromPage(d,fname,ctx){
  const id=pid(),S=`[data-pid="${id}"]`;
  const fix=u=>{if(!isLocal(u))return u;const k=baseName(u);if(!k)return u;if(!ctx.assets.has(k))ctx.missing.add(k);return assetUrl(k)};
  const fixCss=s=>s.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g,(m,q,u)=>isLocal(u)?`url("${fix(u)}")`:m);
  let css='';const links=[],imports=[],scripts=[];
  for(const e of d.querySelectorAll('style,link[rel~="stylesheet" i]')){
    if(e.tagName==='STYLE')css+=e.textContent+'\n';
    else{
      const h=e.getAttribute('href')||'';
      if(isLocal(h)){const k=baseName(h);if(ctx.css[k]!=null)css+=ctx.css[k]+'\n';else ctx.missing.add(k)}
      else{const t=await fetchCss(h);t==null?links.push(h):css+=t+'\n'}
    }
    e.remove();
  }
  css=css.replace(/@import\s+(?:url\()?\s*['"]?([^'")\s;]+)['"]?\s*\)?[^;]*;/g,(m,u)=>{
    if(!isLocal(u)){imports.push(m);return ''}
    const k=baseName(u);if(ctx.css[k]!=null)return ctx.css[k];ctx.missing.add(k);return '';
  });
  const sc=scopeCSS(fixCss(css),id);
  for(const s of d.querySelectorAll('script')){
    const src=s.getAttribute('src');
    if(src&&isLocal(src)){const k=baseName(src);if(ctx.js[k]==null){ctx.missing.add(k);s.remove();continue}s.removeAttribute('src');s.textContent=ctx.js[k]}
    if(!d.body.contains(s)){scripts.push(s.outerHTML);s.remove()}
  }
  const B=d.body,inline=s=>renameAnim(vhFix(fixCss(s)),sc.frames,id);
  B.querySelectorAll('meta,title,base').forEach(e=>e.remove());
  B.querySelectorAll('[src]').forEach(e=>e.setAttribute('src',fix(e.getAttribute('src'))));
  B.querySelectorAll('[poster]').forEach(e=>e.setAttribute('poster',fix(e.getAttribute('poster'))));
  B.querySelectorAll('[srcset]').forEach(e=>e.setAttribute('srcset',e.getAttribute('srcset').split(',').map(c=>{const [u,...r]=c.trim().split(/\s+/);return [fix(u),...r].join(' ')}).join(', ')));
  B.querySelectorAll('image').forEach(e=>['href','xlink:href'].forEach(a=>e.hasAttribute(a)&&e.setAttribute(a,fix(e.getAttribute(a)))));
  B.querySelectorAll('[style]').forEach(e=>e.setAttribute('style',inline(e.getAttribute('style'))));
  const attrs=(el,cls)=>` class="${esc((cls+' '+(el.getAttribute('class')||'')).trim())}"`+[...el.attributes].filter(a=>!/^(class|xmlns.*|on.*)$/i.test(a.name)).map(a=>` ${a.name}="${esc(a.name==='style'?inline(a.value):a.value)}"`).join('');
  const make=(W,H,bg)=>`<style>
${imports.join('\n')}
:where(${S} > .pg-html){display:flow-root;container:pg/inline-size;min-height:100%;font:initial;color:CanvasText;background:${bg||'transparent'};--pg-vw:${W/100}px;--pg-vh:${H/100}px}
:where(${S} .pg-html,${S} .pg-html *){box-sizing:content-box}
:where(${S} .pg-body){margin:8px}
${sc.css}
</style>
${links.map(h=>`<link rel="stylesheet" href="${esc(h)}">\n`).join('')}<div${attrs(d.documentElement,'pg-html')}>
<div${attrs(B,'pg-body')}>
${B.innerHTML.trim()}
</div>
</div>
${scripts.join('\n')}`;
  let W=doc.project.width,H=doc.project.height,seq=doc.seq,m=await measure(id,make(W,H),W,H);
  if(ctx.adopt&&doc.project.device==='slide'&&m.height>H*1.15){adoptSize(1440,900);W=1440;H=900;doc.seq=seq;m=await measure(id,make(W,H),W,H);ctx.notes.push('已换成桌面网页尺寸')}
  if(ctx.adopt){doc.project.background=m.bg||'#ffffff';if(d.title&&(!doc.project.title||doc.project.title==='未命名项目'))doc.project.title=d.title}
  ctx.adopt=false;
  const h1=d.querySelector('h1');
  return {page:{id,title:(d.title||(h1&&norm(h1.textContent))||fname.replace(/\.html?$/i,'')).slice(0,40),notes:`导入自 ${fname}`,
    height:doc.project.device==='slide'&&m.height<=H*1.15?H:m.height,modules:m.modules},html:make(W,H,m.bg)};
}
// 画板导出的整套页面 → 每个 section.slide 一页
async function fromDeck(d,slides,fname,ctx){
  const f=slides[0],w=parseFloat(f.style.width)||doc.project.width,h=parseFloat(f.style.height)||doc.project.height;
  if(ctx.adopt){
    adoptSize(w,h);const bg=toHex(f.style.backgroundColor);if(bg)doc.project.background=bg;
    if(d.title&&(!doc.project.title||doc.project.title==='未命名项目'))doc.project.title=d.title;
  }else if(w!==doc.project.width)ctx.notes.push(`原稿宽 ${w}px，和当前项目（${doc.project.width}px）不一样`);
  ctx.adopt=false;
  const out=[];
  for(const s of slides){
    const old=s.getAttribute('data-pid'),id=pid(),ph=parseFloat(s.style.height)||h,hd=s.querySelector('h1,h2,h3');
    const page={id,title:(hd?norm(hd.textContent):'').slice(0,40)||`第 ${out.length+1} 页`,notes:`导入自 ${fname}`,height:ph,modules:[]};
    if(s.querySelector(':scope > .wf-tag')){ // 还没生成的线框页：把线框还原成模块
      page.modules=[...s.querySelectorAll(':scope > .wf-m')].map(e=>{
        const type=(e.className.match(/\bwf-(\w+)/g)||[]).map(x=>x.slice(3)).find(k=>T[k])||'box',b=e.querySelector('b'),sm=e.querySelector('small');
        return {id:uid(),no:++doc.seq,type,name:T[type].n,x:parseFloat(e.style.left)||0,y:parseFloat(e.style.top)||0,w:parseFloat(e.style.width)||100,h:parseFloat(e.style.height)||60,
          text:TEXTY.has(type)&&b?b.textContent:'',notes:{...blankNotes(),content:sm?sm.textContent:''}};
      });
      out.push({page,html:null});continue;
    }
    const html=s.innerHTML.trim().split(old).join(id);
    page.modules=(await measure(id,html,doc.project.width,ph,ph)).modules;

  }
  return out;
}

let importing=false;
async function importFiles(files){
  if(importing)return;
  const htmls=files.filter(f=>/\.html?$/i.test(f.name)),others=files.filter(f=>!/\.html?$/i.test(f.name));
  if(!htmls.length&&!others.length)return;
  importing=true;toast(htmls.length?'正在导入…':'正在上传…',20000);
  try{
    const ctx={css:{},js:{},assets:new Set(),missing:new Set(),notes:[],adopt:doc.pages.length===1&&!pg().modules.length&&!parts[pg().id]};
    for(const f of others){
      const k=f.name.toLowerCase();
      if(/\.css$/.test(k))ctx.css[k]=await f.text();
      else if(/\.m?js$/.test(k))ctx.js[k]=await f.text();
      else ctx.assets.add(await uploadAsset(f));
    }
    if(!htmls.length){ // 只拖了图片：补上之前导入时缺的文件
      if(mode==='preview'){await saveDeck();loadPreview()}
      toast(`已上传 ${ctx.assets.size} 个文件到 output/assets/，导入的网页会自动用上`,3600);return;
    }
    checkpoint();
    const blank=ctx.adopt,items=[];
    for(const f of htmls){
      const d=new DOMParser().parseFromString(await f.text(),'text/html');
      const slides=[...d.querySelectorAll('section.slide[data-pid]')];
      if(slides.length)items.push(...await fromDeck(d,slides,f.name,ctx));
      else items.push(await fromPage(d,f.name,ctx));
    }
    const at=blank?0:cur+1;
    doc.pages.splice(at,blank?1:0,...items.map(it=>it.page));
    await Promise.all(items.filter(it=>it.html!=null).map(it=>{parts[it.page.id]=it.html;return savePart(it.page.id)}));
    $('#ptitle').value=doc.project.title||'';
    cur=at;clearEls();sel.clear();changed();fitView();
    await saveDeck();
    if(mode==='preview')loadPreview();else await setMode('preview');
    const miss=[...ctx.missing];
    toast(`已导入 ${items.length} 页`+(ctx.notes.length?'，'+ctx.notes.join('，'):'')+
      (miss.length?`。缺 ${miss.length} 个文件：${miss.slice(0,3).join('、')}${miss.length>3?' 等':''}，把它们拖进来就能补上`:'。点文字直接改，或选中元素让 AI 改'),miss.length?7000:3600);
  }catch(e){console.error(e);toast('导入失败：'+String(e.message||e).slice(0,60))}
  finally{importing=false}
}
const importIn=Object.assign(document.createElement('input'),{type:'file',multiple:true,accept:'.html,.htm,.css,.js,image/*,video/*,audio/*,.woff,.woff2,.ttf,.otf'});
importIn.onchange=()=>{const f=[...importIn.files];importIn.value='';importFiles(f)};
function openImport(){closeSheets();importIn.click()}
// 把文件拖进窗口导入（页面条里拖动排序不算）
const isFileDrag=e=>dragFrom<0&&e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
function hookDrop(d){
  d.addEventListener('dragenter',e=>{if(isFileDrag(e)){e.preventDefault();document.body.classList.add('dropping')}});
  d.addEventListener('dragover',e=>{if(isFileDrag(e)){e.preventDefault();e.dataTransfer.dropEffect='copy'}});
}
hookDrop(document);
$('#dropzone').addEventListener('dragleave',e=>{if(!e.relatedTarget||!$('#dropzone').contains(e.relatedTarget))document.body.classList.remove('dropping')});
$('#dropzone').addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dropping');importFiles([...e.dataTransfer.files])});
document.addEventListener('drop',e=>{if(isFileDrag(e)){e.preventDefault();document.body.classList.remove('dropping')}});

/* ================= 播放 ================= */
let plPage=null;
async function play(){
  closeSheets();await loadParts();await saveDeck();
  const pl=$('#player');plPage=null;
  pl.innerHTML=`<iframe src="/output/index.html?p=${pg().id}&t=${Date.now()}" allow="fullscreen"></iframe><div class="plbar"><button id="pl-open">在浏览器打开</button><button id="pl-x">退出 Esc</button></div>`;
  pl.classList.add('on');requestAnimationFrame(()=>pl.classList.add('show'));
  const fr=pl.querySelector('iframe');fr.onload=()=>fr.contentWindow.focus();
  $('#pl-x').onclick=closePlayer;
  $('#pl-open').onclick=()=>window.open(`/output/index.html#${(plPage??cur)+1}`,'_blank');
}
function closePlayer(){
  const pl=$('#player');if(!pl.classList.contains('on'))return;
  pl.classList.remove('show');setTimeout(()=>{pl.classList.remove('on');pl.innerHTML=''},350);
  if(plPage!=null&&plPage!==cur)goPage(plPage);
}
addEventListener('message',e=>{
  if(!e.data||!e.data.deck)return;
  if(e.data.deck==='page'&&$('#player').classList.contains('on'))plPage=e.data.i;
  if(e.data.deck==='exit')closePlayer();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#player').classList.contains('on'))closePlayer()},true);

/* ================= 保存 / 读取 ================= */
const README='网页画板数据（v2，多页面）。project=项目设置（width 宽度 px、device、background、notes=整体说明）；pages=按顺序排列的页面，每页有 title、notes=本页说明、height、generated=是否已生成网页、modules；modules 按层级从下到上，x/y/w/h 为相对该页左上角的 px，no=画布上显示的编号（全局唯一），inside=被哪个编号的模块完整包含，text=模块上显示的文字，notes.content/function/effect=内容/功能/效果。生成的网页：每页源码在 output/parts/<页面id>.html，拼好的整套在 output/index.html。';
let saveTimer=0,saving=false,lastMtime=0,online=true;
function setStatus(s){const el=$('#status');el.className=s;el.querySelector('span').textContent={saved:'已保存',saving:'保存中…',editing:'编辑中',offline:'仅本地保存'}[s]}
function exportPage(p){
  const ms=p.modules;
  return {id:p.id,title:p.title,notes:p.notes,height:p.height,generated:!!parts[p.id],
    modules:ms.map(m=>{
      let par=null,pa=Infinity;
      ms.forEach(b=>{if(b!==m&&b.x<=m.x&&b.y<=m.y&&b.x+b.w>=m.x+m.w&&b.y+b.h>=m.y+m.h&&b.w*b.h>m.w*m.h&&b.w*b.h<pa){par=b;pa=b.w*b.h}});
      return {id:m.id,no:m.no,type:m.type,typeName:T[m.type].n,name:m.name,x:m.x,y:m.y,w:m.w,h:m.h,inside:par?par.no:null,text:m.text||'',notes:{...m.notes}};
    })};
}
function exportBoard(){return {_readme:README,version:2,project:{...doc.project},current:cur,seq:doc.seq,updatedAt:new Date().toISOString(),pages:doc.pages.map(exportPage)}}
function scheduleSave(){setStatus('editing');clearTimeout(saveTimer);saveTimer=setTimeout(save,400)}
async function save(){
  saveTimer=0;const data=exportBoard();
  try{localStorage.setItem('wb-backup',JSON.stringify(data))}catch{}
  saving=true;setStatus('saving');
  try{
    const r=await fetch('/api/board',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!r.ok)throw 0;lastMtime=(await r.json()).mtime;online=true;setStatus('saved');
  }catch{online=false;setStatus('offline')}
  saving=false;
}
const normMod=m=>({id:m.id||uid(),no:m.no,type:T[m.type]?m.type:'box',name:m.name??(T[m.type]?.n||'自由框'),x:+m.x||0,y:+m.y||0,w:+m.w||100,h:+m.h||60,text:String(m.text||''),notes:{...blankNotes(),...(m.notes||{})}});
function load(b){
  if(b.pages){
    doc={version:2,project:{...doc.project,...b.project},pages:b.pages.map(p=>({id:p.id||pid(),title:p.title||'',notes:p.notes||'',height:+p.height||(b.project&&b.project.height)||720,modules:(p.modules||[]).map(normMod)})),seq:b.seq||0};
    if(!doc.pages.length)doc.pages.push(newPage('第 1 页'));
    cur=clamp(b.current??cur,0,doc.pages.length-1);
  }else{ // v1：单页
    const P=b.page||{};
    doc={version:2,project:{title:P.title||'未命名项目',device:P.device||'custom',width:P.width||390,height:P.height||844,background:P.background||'#ffffff',notes:P.notes||''},
      pages:[{id:pid(),title:'第 1 页',notes:'',height:P.height||844,modules:(b.modules||[]).map(normMod)}],seq:b.seq||0};
    cur=0;
  }
  let seq=doc.seq;doc.pages.forEach(p=>p.modules.forEach(m=>{if(m.no==null)m.no=++seq;seq=Math.max(seq,m.no)}));doc.seq=seq;
  sel=new Set([...sel].filter(byId));
  $('#ptitle').value=doc.project.title||'';
}
setInterval(async()=>{
  if(drag||saveTimer||saving)return;
  const ae=document.activeElement;if(ae&&(/INPUT|TEXTAREA|IFRAME/.test(ae.tagName)||ae.isContentEditable))return;
  try{
    const j=await (await fetch('/api/mtime')).json();
    if(!j.mtime||j.mtime===lastMtime)return;
    const b=await (await fetch('/api/board')).json();
    if(drag||saveTimer||saving)return;
    lastMtime=b.mtime;
    if(b.board){checkpoint();const oc=cur;load(b.board);if(cur!==oc)clearEls();await loadParts();refresh();toast('画板已从文件更新')}
  }catch{}
},1500);

let viewTouched=false,resizeT=0;
addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{updateSeg($('#modeseg'));updateSeg($('#libseg'));layoutPreview();posFbar();if(!viewTouched)fitView()},120)});

async function init(){
  buildLib();
  let b=null;
  try{const j=await (await fetch('/api/board')).json();b=j.board;lastMtime=j.mtime}
  catch{online=false;try{b=JSON.parse(localStorage.getItem('wb-backup'))}catch{}}
  if(b)load(b);else $('#ptitle').value=doc.project.title;
  await Promise.all([loadParts(),loadCfg()]);
  refresh();updateUndoBtns();setStatus(online?'saved':'offline');
  document.querySelectorAll('#libseg button')[0].classList.add('on');
  requestAnimationFrame(()=>{updateSeg($('#modeseg'));updateSeg($('#libseg'));fitView(false)});
}
init();
</script>
