<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网页画板</title>
<style>
:root{
  --accent:#007AFF; --accent-soft:rgba(0,122,255,.12);
  --bg:#f2f2f7; --dot:rgba(60,60,67,.16);
  --panel:rgba(255,255,255,.76); --panel-border:rgba(0,0,0,.07);
  --text:#1d1d1f; --text2:rgba(60,60,67,.62); --text3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.12); --field:rgba(118,118,128,.12); --hover:rgba(118,118,128,.12);
  --thumb:#fff; --shadow:0 0 0 .5px rgba(0,0,0,.06),0 10px 36px rgba(0,0,0,.10);
  --danger:#FF3B30; --guide:#FF2D55; --z:1;
  --spring:cubic-bezier(.32,.72,0,1); --bounce:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root{
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.22);
  --bg:#161618; --dot:rgba(235,235,245,.10);
  --panel:rgba(40,40,42,.76); --panel-border:rgba(255,255,255,.08);
  --text:#f5f5f7; --text2:rgba(235,235,245,.6); --text3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --field:rgba(118,118,128,.24); --hover:rgba(118,118,128,.22);
  --thumb:#636366; --shadow:0 0 0 .5px rgba(255,255,255,.06),0 10px 36px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
svg{display:block}

/* ---------- 画布 ---------- */
#ws{position:fixed;inset:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);touch-action:none}
#ws.space{cursor:grab} #ws.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
body.preview #world{visibility:hidden}
#artboard{position:absolute;left:0;top:0;background:#fff;box-shadow:0 0 0 calc(.5px / var(--z)) rgba(0,0,0,.10),0 calc(10px / var(--z)) calc(44px / var(--z)) rgba(0,0,0,.10);transition:background .3s}
#artboard.swap{animation:swap .45s var(--spring)}
@keyframes swap{from{opacity:0;transform:translateY(calc(14px / var(--z)))}}
#btitle{position:absolute;left:0;top:calc(-28px / var(--z));font-size:calc(12px / var(--z));color:var(--text2);white-space:nowrap;font-weight:500}
#btitle b{color:var(--text);font-weight:600;margin-right:calc(6px / var(--z))}
#hint{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(10px / var(--z));pointer-events:none;color:rgba(120,120,128,.75);font-size:calc(14px / var(--z));text-align:center;line-height:1.6;transition:opacity .3s}
#hint svg{width:calc(34px / var(--z));height:calc(34px / var(--z));opacity:.6}
#fx,#overlay{position:absolute;left:0;top:0;pointer-events:none}

/* 模块 */
.m{position:absolute;border-radius:8px}
.m-body{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:color-mix(in srgb,var(--page,#fff) 94%,#78787f);box-shadow:inset 0 0 0 1px rgba(120,120,128,.26);container-type:size;color:rgba(120,120,128,.9)}
.m::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 0 transparent;transition:box-shadow .18s}
.m:hover::after,.m.hl::after{box-shadow:0 0 0 calc(1.5px / var(--z)) var(--accent)}
.m.sel::after{box-shadow:0 0 0 calc(2px / var(--z)) var(--accent)}
body.dragging .m:not(.sel)::after{box-shadow:none}
.m.pop{animation:pop .5s var(--bounce)}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.m.poof{animation:poof .22s ease-in forwards}
@keyframes poof{to{opacity:0;transform:scale(.9)}}
.badge{position:absolute;left:0;top:0;transform:translate(calc(-9px / var(--z)),-50%);height:calc(18px / var(--z));min-width:calc(18px / var(--z));padding:0 calc(5px / var(--z));border-radius:calc(9px / var(--z));background:#8E8E93;color:#fff;font-size:calc(10.5px / var(--z));font-weight:600;display:flex;align-items:center;justify-content:center;white-space:nowrap;box-shadow:0 0 0 calc(1.5px / var(--z)) #fff,0 calc(1px / var(--z)) calc(4px / var(--z)) rgba(0,0,0,.18);z-index:3;pointer-events:none;transition:background .2s}
.badge.has{background:var(--accent)}
.badge .bn{max-width:0;overflow:hidden;opacity:0;font-weight:500;transition:max-width .4s var(--spring),opacity .2s,margin .4s var(--spring)}
.m:hover .badge .bn,.m.hl .badge .bn,.m.sel .badge .bn{max-width:calc(220px / var(--z));opacity:1;margin-left:calc(4px / var(--z))}

/* 线框骨架 */
.sk{display:block;background:rgba(120,120,128,.22);border-radius:4px}
.sk0{background:rgba(120,120,128,.14)}
#artboard.dark .m-body{background:color-mix(in srgb,var(--page) 86%,#9a9aae);box-shadow:inset 0 0 0 1px rgba(210,210,225,.22);color:rgba(210,210,225,.8)}
#artboard.dark .sk{background:rgba(210,210,225,.2)} #artboard.dark .sk0{background:rgba(210,210,225,.08)}
#artboard.dark .ph,#artboard.dark .ph2,#artboard.dark .ph3{color:rgba(210,210,225,.6)}
.row{display:flex;align-items:center} .col{display:flex;flex-direction:column}
.fill{height:100%} .grow{flex:1;min-width:0} .center{display:flex;align-items:center;justify-content:center;position:relative}
.ph{width:min(26%,64px);height:auto;color:rgba(120,120,128,.6)}
.ph2{width:62%;height:62%;color:rgba(120,120,128,.75)}
.ph3{width:16px;height:16px;flex:none;color:rgba(120,120,128,.75)}
.narrow-only{display:none!important}
@container (max-width:560px){.wide-only{display:none!important}.narrow-only{display:flex!important}}
.play{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.88);position:relative}
.play::after{content:"";position:absolute;left:18px;top:14px;border-left:14px solid rgba(60,60,67,.8);border-top:9px solid transparent;border-bottom:9px solid transparent}
.li{gap:12px;padding:10px 14px;border-bottom:1px solid rgba(120,120,128,.15);flex:none}
.arrow{position:absolute;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:rgba(255,255,255,.75)}
.arrow.l{left:12px} .arrow.r{right:12px}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(60,60,67,.3)} .dots i.on{width:18px;background:rgba(60,60,67,.6)}
.inbox{display:block;height:36px;flex:none;border-radius:8px;background:var(--page,#fff);box-shadow:inset 0 0 0 1px rgba(120,120,128,.35)}
.btnfill{display:block;flex:none;background:var(--accent);opacity:.8;border-radius:10px}
.gridk{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;padding:10px}
.gridk .sk{aspect-ratio:1;border-radius:8px}
.sec-label{position:absolute;left:10px;top:8px;font-size:12px;font-weight:500;color:rgba(120,120,128,.95)}
.t-nav,.t-tabbar,.t-footer,.t-section,.t-carousel,.t-sidebar{border-radius:0}
.t-nav .m-body,.t-tabbar .m-body{background:color-mix(in srgb,var(--page,#fff) 96%,#78787f)}
.t-section .m-body{background:rgba(120,120,128,.03);box-shadow:none;border:1.5px dashed rgba(120,120,128,.42)}
.t-heading .m-body,.t-text .m-body{background:transparent;box-shadow:inset 0 0 0 1px rgba(120,120,128,.14)}
.t-button{border-radius:12px} .t-button .m-body{background:var(--accent);box-shadow:none}
.t-avatar{border-radius:50%} .t-icon{border-radius:12px} .t-search{border-radius:999px} .t-card{border-radius:14px}
.t-input{border-radius:10px} .t-input .m-body{background:var(--page,#fff);box-shadow:inset 0 0 0 1px rgba(120,120,128,.4)}
.t-modal{border-radius:16px} .t-modal .m-body{background:var(--page,#fff);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 16px 48px rgba(0,0,0,.18)}
.t-sticky{border-radius:4px} .t-sticky .m-body{background:#FFE98A;box-shadow:0 2px 10px rgba(0,0,0,.12)}
/* 模块上的文字 */
.tx{width:100%;height:100%;display:flex;align-items:center;color:var(--ink,#1d1d1f);white-space:pre-wrap;word-break:break-word;overflow:hidden;outline:none}
.tx-heading{font-weight:700;font-size:min(58cqh,72px);line-height:1.2;letter-spacing:-.01em;padding:0 2px}
.tx-text{font-size:15px;line-height:1.65;align-items:flex-start;color:var(--ink2,#3a3a3c);padding:4px 2px}
.tx-button{justify-content:center;color:#fff;font-size:15px;font-weight:600;text-align:center;padding:0 8px}
.tx-box{justify-content:center;text-align:center;font-size:13px;font-weight:500;color:rgba(120,120,128,.95);padding:6px}
.tx-sticky{align-items:flex-start;padding:12px 14px;font-size:13px;line-height:1.5;color:#5c4a00}
.tx-input,.tx-search{padding:0 12px;font-size:14px;color:rgba(120,120,128,.9)}
.tx-search{padding-left:0}
.tx.ph-empty{color:rgba(120,120,128,.55)}
.inline-ed{cursor:text;user-select:text;-webkit-user-select:text}
.m.editing::after{box-shadow:0 0 0 calc(2px / var(--z)) var(--accent),0 0 0 calc(6px / var(--z)) var(--accent-soft)}

/* 选中框、参考线 */
#selbox{position:absolute;display:none}
#selbox.multi{outline:calc(1px / var(--z)) dashed var(--accent)}
.handle{position:absolute;width:calc(9px / var(--z));height:calc(9px / var(--z));background:#fff;border:calc(1.5px / var(--z)) solid var(--accent);border-radius:50%;transform:translate(-50%,-50%);pointer-events:auto;box-shadow:0 calc(1px / var(--z)) calc(3px / var(--z)) rgba(0,0,0,.22)}
.handle::before{content:"";position:absolute;inset:calc(-4px / var(--z))}
.handle[data-d=nw]{left:0;top:0;cursor:nwse-resize}.handle[data-d=n]{left:50%;top:0;cursor:ns-resize}.handle[data-d=ne]{left:100%;top:0;cursor:nesw-resize}
.handle[data-d=e]{left:100%;top:50%;cursor:ew-resize}.handle[data-d=se]{left:100%;top:100%;cursor:nwse-resize}.handle[data-d=s]{left:50%;top:100%;cursor:ns-resize}
.handle[data-d=sw]{left:0;top:100%;cursor:nesw-resize}.handle[data-d=w]{left:0;top:50%;cursor:ew-resize}
.sel-label{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:calc(8px / var(--z));padding:calc(2px / var(--z)) calc(7px / var(--z));font-size:calc(11px / var(--z));line-height:1.5;background:var(--accent);color:#fff;border-radius:calc(5px / var(--z));white-space:nowrap;font-weight:500}
.guide{position:absolute;background:var(--guide)}
.drop-prev{position:absolute;border:calc(1.5px / var(--z)) dashed var(--accent);background:var(--accent-soft);border-radius:8px;transition:opacity .15s}
#hhandle{position:absolute;width:calc(64px / var(--z));height:calc(16px / var(--z));transform:translate(-50%,-50%);pointer-events:auto;cursor:ns-resize;display:grid;place-items:center}
#hhandle i{width:calc(38px / var(--z));height:calc(5px / var(--z));border-radius:calc(3px / var(--z));background:rgba(120,120,128,.45);transition:background .2s,width .3s var(--spring)}
#hhandle:hover i{background:var(--accent);width:calc(52px / var(--z))}
#marquee{position:fixed;display:none;border:1px solid var(--accent);background:var(--accent-soft);border-radius:2px;pointer-events:none;z-index:5}

/* ---------- 面板 ---------- */
.glass{background:var(--panel);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);border:.5px solid var(--panel-border);box-shadow:var(--shadow);border-radius:14px}
#toolbar{position:fixed;top:10px;left:10px;right:10px;height:46px;display:flex;align-items:center;padding:0 8px;z-index:20}
#toolbar .side{flex:1 1 0;display:flex;align-items:center;gap:4px;min-width:0}
#toolbar .side.r{justify-content:flex-end;flex:1 0 auto;margin-left:8px}
#ptitle{border:0;background:transparent;font:600 14px/1 inherit;color:var(--text);padding:6px 8px;border-radius:7px;outline:none;min-width:0;width:180px;transition:background .2s}
#ptitle:hover{background:var(--hover)} #ptitle:focus{background:var(--field);box-shadow:0 0 0 3px var(--accent-soft)}
.ib{width:30px;height:30px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;cursor:default;flex:none;transition:background .15s,transform .2s var(--bounce),opacity .2s}
.ib:hover{background:var(--hover)} .ib:active{transform:scale(.9)} .ib:disabled{opacity:.3;background:transparent;transform:none}
.ib svg{width:18px;height:18px}
.tbtn{height:30px;border:0;border-radius:8px;padding:0 10px 0 8px;display:flex;align-items:center;gap:5px;background:var(--field);font-weight:500;font-size:12.5px;cursor:default;flex:none;transition:background .15s,transform .2s var(--bounce)}
.tbtn:hover{background:var(--hover)} .tbtn:active{transform:scale(.94)}
.tbtn svg{width:16px;height:16px}
.tbtn.ai{background:linear-gradient(135deg,#5E5CE6,#BF5AF2);color:#fff}
.tbtn.ai:hover{filter:brightness(1.08)}
.vsep{width:1px;height:18px;background:var(--sep);margin:0 4px;flex:none}
#zoomlbl{border:0;background:transparent;font:500 12px/1 inherit;font-variant-numeric:tabular-nums;width:46px;height:30px;border-radius:8px;cursor:default;flex:none}
#zoomlbl:hover{background:var(--hover)}
#status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);padding:0 6px;white-space:nowrap}
#status i{width:7px;height:7px;border-radius:50%;background:#34C759;transition:background .3s;flex:none}
#status.saving i{background:#8E8E93;animation:pulse 1s infinite} #status.offline i{background:#FF9500}
@keyframes pulse{50%{opacity:.3}}
.seg{display:inline-flex;position:relative;background:var(--field);border-radius:9px;padding:2px;flex:none}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:4px 14px;border-radius:7px;font-size:12px;font-weight:500;line-height:18px;cursor:default;transition:color .2s}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:0;border-radius:7px;background:var(--thumb);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:left .4s var(--spring),width .4s var(--spring),opacity .2s}

#lib,#insp{position:fixed;top:66px;bottom:10px;z-index:10;display:flex;flex-direction:column;overflow:hidden;transition:transform .5s var(--spring),opacity .35s}
#lib{left:10px;width:232px} #insp{right:10px;width:276px}
body.no-lib #lib{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
body.no-insp #insp{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
.phead{padding:10px 10px 8px;flex:none}
.phead .seg{display:flex} .phead .seg button{flex:1}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 10px 12px}
.scroll::-webkit-scrollbar{width:0}
.cat{font-size:11px;font-weight:600;color:var(--text2);margin:12px 4px 6px;letter-spacing:.02em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 8px;border-radius:10px;cursor:grab;transition:background .15s,transform .25s var(--bounce)}
.tile:hover{background:var(--hover)} .tile:active{transform:scale(.93);cursor:grabbing}
.tile svg{width:22px;height:22px;color:var(--accent)}
.tile span{font-size:11px;color:var(--text);white-space:nowrap}
.ghost{position:fixed;z-index:100;pointer-events:none;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-radius:10px;font-size:12px;font-weight:500;animation:ghostIn .3s var(--bounce)}
.ghost svg{width:16px;height:16px;color:var(--accent)}
@keyframes ghostIn{from{transform:scale(.6);opacity:0}}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:default;transition:background .12s}
.lrow:hover{background:var(--hover)} .lrow.on{background:var(--accent);color:#fff}
.lrow svg{width:15px;height:15px;flex:none;color:var(--text2)} .lrow.on svg{color:#fff}
.lno{font-size:10px;font-weight:600;min-width:18px;height:16px;border-radius:8px;background:var(--field);display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0 4px}
.lrow.on .lno{background:rgba(255,255,255,.25)}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none} .lrow.on .ldot{background:#fff}
.empty{color:var(--text3);text-align:center;padding:30px 0;font-size:12px}

/* 页面条 */
#strip{position:fixed;bottom:10px;left:252px;right:296px;height:92px;z-index:9;display:flex;align-items:center;gap:12px;padding:0 14px;overflow-x:auto;overflow-y:hidden;transition:left .5s var(--spring),right .5s var(--spring)}
#strip::-webkit-scrollbar{height:0}
body.no-lib #strip{left:10px} body.no-insp #strip{right:10px}
.pthumb{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:default;padding-top:4px}
.tb{position:relative;border-radius:5px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 1px 4px rgba(0,0,0,.1);transition:box-shadow .2s,transform .3s var(--bounce)}
.pthumb:hover .tb{transform:translateY(-2px)}
.pthumb.on .tb{box-shadow:0 0 0 2.5px var(--accent),0 4px 12px rgba(0,0,0,.12)}
.pthumb.dl .tb{box-shadow:-4px 0 0 var(--accent)} .pthumb.dr .tb{box-shadow:4px 0 0 var(--accent)}
.tn{font-size:10.5px;color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums}
.pthumb.on .tn{color:var(--accent)}
.tm{position:absolute;background:rgba(120,120,128,.3);border-radius:1px}
.tm.b{background:var(--accent);opacity:.75} .tm.s{background:transparent;box-shadow:inset 0 0 0 .5px rgba(120,120,128,.5)}
.gen-dot{position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:#34C759;box-shadow:0 0 0 1.5px #fff}
.addpg{flex:none;width:42px;height:56px;margin-bottom:16px;border-radius:7px;border:1.5px dashed var(--sep);background:transparent;display:grid;place-items:center;color:var(--text2);cursor:default;transition:border-color .2s,color .2s,transform .25s var(--bounce)}
.addpg:hover{border-color:var(--accent);color:var(--accent)} .addpg:active{transform:scale(.92)}
.addpg svg{width:18px;height:18px}

/* 检查器 */
#insp-body{padding-top:4px}
.sec{padding:12px 4px;border-bottom:.5px solid var(--sep)} .sec:last-child{border-bottom:0}
.sec-h{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec-h small{font-weight:400;color:var(--text3);flex:1}
.fld{width:100%;border:0;background:var(--field);border-radius:7px;padding:6px 8px;font:13px/1.4 inherit;color:var(--text);outline:none;transition:box-shadow .2s,background .2s;user-select:text;-webkit-user-select:text}
.fld:focus{box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
.fld::placeholder{color:var(--text3)}
select.fld{appearance:none;-webkit-appearance:none;cursor:default;background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
textarea.fld{resize:none;overflow:hidden;min-height:52px;display:block}
input[type=number]::-webkit-inner-spin-button{display:none}
.geo{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center}
.num{position:relative;display:block}
.num span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--text3);pointer-events:none}
.num input{padding-left:24px;font-variant-numeric:tabular-nums}
.frow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:var(--text2);font-size:12px;gap:8px}
.clr{width:44px;height:24px;border:0;padding:0;background:none;border-radius:6px;overflow:hidden;cursor:default}
.clr::-webkit-color-swatch-wrapper{padding:0}.clr::-webkit-color-swatch{border:0;border-radius:6px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.mhead{display:flex;gap:10px;align-items:center}
.mic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mic svg{width:20px;height:20px}
.mtype{font-size:11px;color:var(--text2);margin:0 0 3px 2px}
.fld.name{font-weight:600;font-size:14px;padding:5px 8px}
.tools{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.tools .ib{width:28px;height:28px} .tools .ib svg{width:17px;height:17px}
.tlabel{font-size:11px;color:var(--text3);width:30px;flex:none}
.note{display:block;margin-bottom:10px}
.nl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;margin:0 0 5px 2px}
.nl i{width:8px;height:8px;border-radius:50%}
.mini{border:0;border-radius:6px;padding:3px 8px 3px 6px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(135deg,#5E5CE6,#BF5AF2);cursor:default;transition:transform .2s var(--bounce),filter .2s}
.mini:hover{filter:brightness(1.08)} .mini:active{transform:scale(.94)} .mini svg{width:12px;height:12px}
.dbtn,.pbtn,.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:7px;font-weight:500;cursor:default;transition:background .15s,transform .2s var(--bounce),opacity .2s}
.dbtn{background:rgba(255,59,48,.1);color:var(--danger)} .dbtn:hover{background:rgba(255,59,48,.16)}
.pbtn{background:var(--accent);color:#fff} .pbtn:hover{filter:brightness(1.07)}
.gbtn{background:var(--field)} .gbtn:hover{background:var(--hover)}
.dbtn:active,.pbtn:active,.gbtn:active{transform:scale(.97)}
.pbtn:disabled,.gbtn:disabled{opacity:.4;transform:none}
.dbtn svg,.pbtn svg,.gbtn svg{width:15px;height:15px}
.brow{display:flex;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--field);color:var(--text2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:#8E8E93}
.pill.ok{color:#248A3D;background:rgba(52,199,89,.14)} .pill.ok::before{background:#34C759}
.tips ul{margin:0;padding:0;list-style:none;color:var(--text2);font-size:12px;line-height:1.5}
.tips li{padding:3px 2px} .tips b{color:var(--text);font-weight:600}
kbd{font:500 11px/1 inherit;background:var(--field);border-radius:4px;padding:2px 5px;color:var(--text)}
.multi-h{font-size:15px;font-weight:600;padding:2px 2px 0}

/* 预览 */
#pv{position:fixed;display:none;z-index:2;border-radius:12px;overflow:hidden}
body.preview #pv{display:block}
#pvframe{width:100%;height:100%;border:0;display:block;background:transparent}
#pvempty{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;pointer-events:none;padding-bottom:18px}
#pvempty .glass{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;font-size:13px}
#fbar{position:fixed;z-index:30;display:none;align-items:center;gap:6px;padding:5px 5px 5px 10px;width:340px;border-radius:12px;animation:menuIn .2s var(--spring)}
#fbar svg{width:15px;height:15px;color:#AF52DE;flex:none}
#fbar input{flex:1;border:0;background:transparent;outline:none;font:13px inherit;color:var(--text);min-width:0;user-select:text}
#fbar .tag{font-size:10.5px;color:var(--text3);font-family:ui-monospace,Menlo,monospace}
.send{width:28px;height:28px;border-radius:8px;border:0;background:linear-gradient(135deg,#5E5CE6,#BF5AF2);color:#fff;display:grid;place-items:center;flex:none;cursor:default}
.send svg{width:15px!important;height:15px!important;color:#fff!important}

/* 弹层：AI 面板、设置 */
.backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.12);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sheet{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:81;width:min(560px,calc(100vw - 32px));padding:14px;border-radius:16px;animation:sheetIn .35s var(--spring)}
@keyframes sheetIn{from{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.97)}}
.sheet h3{margin:2px 4px 12px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.sheet h3 svg{width:18px;height:18px;color:#AF52DE}
.sheet h3 small{font-weight:400;font-size:12px;color:var(--text3);margin-left:auto}
.sheet textarea.fld{min-height:64px;font-size:14px;padding:10px 12px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.act.span2{grid-column:1/-1}
.act{border:0;border-radius:10px;padding:9px 12px;text-align:left;background:var(--field);cursor:default;transition:background .15s,transform .2s var(--bounce)}
.act:hover{background:var(--hover)} .act:active{transform:scale(.98)}
.act b{display:block;font-size:13px;font-weight:600} .act span{font-size:11.5px;color:var(--text2)}
.act.primary{background:linear-gradient(135deg,#5E5CE6,#BF5AF2);color:#fff} .act.primary span{color:rgba(255,255,255,.8)}
.act:disabled{opacity:.4}
.warn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,149,0,.13);color:#C93400;font-size:12.5px;margin-bottom:10px}
.lab{display:block;font-size:11px;font-weight:600;color:var(--text2);margin:10px 2px 5px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:4px 11px;background:var(--field);font-size:12px;cursor:default;transition:background .15s}
.chip:hover{background:var(--hover)} .chip.on{background:var(--accent);color:#fff}
.hint2{font-size:11.5px;color:var(--text3);margin:8px 2px 0;line-height:1.5}
.sbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.sbtns button{width:auto;padding:7px 16px}
#busy{position:fixed;left:50%;bottom:116px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;font-size:13px;font-weight:500;transition:transform .45s var(--spring),opacity .3s}
#busy.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#busy button{border:0;border-radius:999px;padding:4px 12px;background:var(--field);font-size:12px;cursor:default}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* 播放 */
#dropzone{position:fixed;inset:10px;z-index:300;display:none;place-items:center;border-radius:18px;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
body.dropping #dropzone{display:grid}
#dropzone .glass{pointer-events:none;padding:18px 26px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--text2)}
#dropzone b{font-size:17px;color:var(--text)}
#player{position:fixed;inset:0;z-index:200;background:#000;display:none;opacity:0;transition:opacity .35s}
#player.on{display:block} #player.show{opacity:1}
#player iframe{width:100%;height:100%;border:0;display:block}
.plbar{position:absolute;top:14px;right:14px;display:flex;gap:8px;opacity:0;transition:opacity .3s}
#player:hover .plbar{opacity:1}
.plbar button{border:0;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:500;color:#fff;background:rgba(60,60,67,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);cursor:default}

/* 菜单、提示 */
.menu{position:fixed;z-index:90;min-width:190px;padding:5px;border-radius:11px;font-size:13px;transform-origin:top left;animation:menuIn .18s var(--spring)}
@keyframes menuIn{from{opacity:0;transform:scale(.94)}}
.mi{display:flex;justify-content:space-between;gap:24px;padding:4px 10px;border-radius:6px;cursor:default}
.mi:hover{background:var(--accent);color:#fff} .mi:hover .k{color:rgba(255,255,255,.8)}
.mi.dis{opacity:.35;pointer-events:none} .mi.red{color:var(--danger)} .mi.red:hover{background:var(--danger);color:#fff}
.mi .k{color:var(--text3)}
.msep{height:.5px;background:var(--sep);margin:5px 8px}
#toast{position:fixed;left:50%;bottom:116px;transform:translate(-50%,20px);opacity:0;z-index:70;padding:9px 16px;border-radius:12px;font-size:13px;font-weight:500;pointer-events:none;transition:transform .45s var(--spring),opacity .3s;max-width:80vw}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:1180px){.wide{display:none!important} #status span{display:none} #ptitle{width:140px}}
@media (max-width:1000px){#lib{width:204px} #insp{width:250px} #strip{left:224px;right:270px} .tile span{font-size:10.5px}}
@media (max-width:820px){#ptitle{width:90px} .seg button{padding:4px 10px} .tbtn span{display:none} .tbtn{padding:0 7px}}
</style>
</head>

const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ================= 模块类型（“家具”） ================= */
const T={
  nav:{n:'导航栏',c:'结构',s:W=>[W,W<600?56:68]},
  tabbar:{n:'标签栏',c:'结构',s:W=>[W,83]},

  box:{n:'自由框',c:'结构',s:()=>[200,140]},

  text:{n:'正文',c:'内容',s:W=>[Math.min(W-40,480),110]},

  list:{n:'列表',c:'组件',s:W=>[Math.min(W-40,480),280]},
  carousel:{n:'轮播图',c:'组件',s:W=>[W,Math.round(W*(W<600?.62:.42))]},

  sticky:{n:'便签',c:'标注',s:()=>[200,150]},

let doc={version:2,project:{title:'未命名项目',device:'slide',width:1280,height:720,background:'#ffffff',notes:''},pages:[],seq:0};

let parts={}, partHist={};

const bbox=ms=>{let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;ms.forEach(m=>{x1=Math.min(x1,m.x);y1=Math.min(y1,m.y);x2=Math.max(x2,m.x+m.w);y2=Math.max(y2,m.y+m.h)});return {x:x1,y:y1,w:x2-x1,h:y2-y1}};
const toWorld=(sx,sy)=>({x:(sx-view.x)/view.z,y:(sy-view.y)/view.z});

/* 撤销 / 重做（整个项目） */
let undoStack=[], redoStack=[];
const snapshot=()=>JSON.stringify({doc,cur});
function pushUndo(s){undoStack.push(s);if(undoStack.length>200)undoStack.shift();redoStack=[];updateUndoBtns()}
const checkpoint=()=>pushUndo(snapshot());
function restore(s){
  const d=JSON.parse(s),oW=doc.project.width,oCur=cur;
  doc=d.doc;cur=clamp(d.cur,0,doc.pages.length-1);
  if(cur!==oCur)clearEls();
  sel=new Set([...sel].filter(byId));
  $('#ptitle').value=doc.project.title||'';changed();
  if(doc.project.width!==oW||cur!==oCur)fitView();
  if(mode==='preview')loadPreview();
}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop());updateUndoBtns()}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());updateUndoBtns()}
function updateUndoBtns(){$('#b-undo').disabled=!undoStack.length;$('#b-redo').disabled=!redoStack.length}

/* ================= 渲染 ================= */
function lum(hex){const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex||'');if(!m)return 1;const [r,g,b]=m.slice(1).map(x=>parseInt(x,16)/255);return .2126*r+.7152*g+.0722*b}
function renderCanvas(){
  const P=doc.project,p=pg(),dark=lum(P.background)<.5;
  artboard.style.width=P.width+'px';artboard.style.height=p.height+'px';artboard.style.background=P.background;
  artboard.style.setProperty('--page',P.background);
  artboard.classList.toggle('dark',dark);
  artboard.style.setProperty('--ink',dark?'#f5f5f7':'#1d1d1f');artboard.style.setProperty('--ink2',dark?'rgba(235,235,245,.75)':'#3a3a3c');
  $('#btitle').innerHTML=`<b>${cur+1} / ${doc.pages.length} · ${esc(p.title||'未命名页面')}</b>${DEV[P.device]?DEV[P.device].n+' · ':''}${P.width} × ${p.height}`;
  const hint=$('#hint');
  hint.style.width=P.width+'px';hint.style.height=Math.min(p.height,700)+'px';
  hint.style.opacity=mods().length?0:1;
  if(!hint.innerHTML)hint.innerHTML=`${ic('drop')}<div>从左侧拖入组件，或单击添加<br>也可以按 ⌘K 让 AI 帮你排版<br>已经有做好的网页？把 .html 拖进来接着改</div>`;
  const hh=$('#hhandle');hh.style.left=P.width/2+'px';hh.style.top=p.height+'px';hh.style.display=P.device==='slide'?'none':'';
  const seen=new Set();
  mods().forEach((m,i)=>{
    seen.add(m.id);
    let el=els.get(m.id);
    if(!el){
      el=document.createElement('div');el.className='m t-'+m.type;el.dataset.id=m.id;
      el.innerHTML='<div class="m-body"></div><div class="badge"></div>';
      els.set(m.id,el);
      if(popIds.delete(m.id)){el.classList.add('pop');el.addEventListener('animationend',()=>el.classList.remove('pop'),{once:true})}
    }
    if(artboard.children[i]!==el)artboard.insertBefore(el,artboard.children[i]||null);
    el.classList.toggle('sel',sel.has(m.id));
    el.style.left=m.x+'px';el.style.top=m.y+'px';el.style.width=m.w+'px';el.style.height=m.h+'px';
    const k=m.type+'|'+m.name+'|'+m.text;
    if(el._k!==k&&!el.classList.contains('editing')){el.firstChild.innerHTML=R[m.type](m);el._k=k}
    const bk=m.no+'|'+m.name;
    if(el._bk!==bk){el.lastChild.innerHTML=`<b>${m.no}</b><span class="bn">${esc(m.name)}</span>`;el._bk=bk}
    el.lastChild.classList.toggle('has',hasNotes(m));
  });
  for(const [id,el] of els)if(!seen.has(id)){
    els.delete(id);
    el.classList.remove('sel','pop');el.classList.add('poof');$('#fx').appendChild(el);
    setTimeout(()=>el.remove(),240);
  }
}
function clearEls(){els.forEach(el=>el.remove());els.clear()}
// 模块在屏幕上很小时少放几个手柄，免得手柄把模块盖住、拖动变成了拉伸
function handlesFor(b){
  const sw=b.w*view.z,sh=b.h*view.z;
  const ds=sw<20||sh<20?['se']:['nw','ne','se','sw',...(sw>=56?['n','s']:[]),...(sh>=56?['e','w']:[])];
  return ds.map(d=>`<i class="handle" data-d="${d}"></i>`).join('');
}
let selZ=1;
function renderSel(){
  selZ=view.z;
  const sb=$('#selbox'), ms=selMods();
  if(!ms.length){sb.style.display='none';return}
  const b=bbox(ms);
  Object.assign(sb.style,{display:'block',left:b.x+'px',top:b.y+'px',width:b.w+'px',height:b.h+'px'});
  sb.classList.toggle('multi',ms.length>1);
  const lab=(ms.length===1?esc(ms[0].name):ms.length+' 个模块')+` · ${Math.round(b.w)} × ${Math.round(b.h)}`;
  sb.innerHTML=(ms.length===1?handlesFor(b):'')+`<div class="sel-label">${lab}</div>`;
}
function renderLayers(){
  const L=$('#layers'), arr=[...mods()].reverse();
  L.innerHTML=arr.length?arr.map(m=>`<div class="lrow${sel.has(m.id)?' on':''}" data-id="${m.id}"><span class="lno">${m.no}</span>${ic(m.type)}<span class="lname">${esc(m.name)}</span>${hasNotes(m)?'<i class="ldot"></i>':''}</div>`).join(''):'<div class="empty">这一页还没有模块</div>';
  $('#libseg [data-tab=layers]').textContent=arr.length?`图层 ${arr.length}`:'图层';
}
function renderStrip(){
  const W=doc.project.width;
  $('#strip').innerHTML=doc.pages.map((p,i)=>{
    const tw=clamp(Math.round(W/p.height*56),34,100),s=tw/W,h=Math.min(56,Math.round(p.height*s));
    const ms=p.modules.map(m=>`<i class="tm${m.type==='button'?' b':''}${m.type==='section'?' s':''}" style="left:${m.x*s}px;top:${m.y*s}px;width:${Math.max(1,m.w*s)}px;height:${Math.max(1,m.h*s)}px"></i>`).join('');
    return `<div class="pthumb${i===cur?' on':''}" data-i="${i}" draggable="true" title="${esc(p.title)}"><div class="tb" style="width:${tw}px;height:${h}px;background:${esc(doc.project.background)}">${ms}${parts[p.id]?'<i class="gen-dot" title="已生成网页"></i>':''}</div><span class="tn">${i+1}</span></div>`;
  }).join('')+`<button class="addpg" id="addpg" title="新建页面">${ic('plus')}</button>`;
}

/* 视图 */
function applyView(){
  world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`;
  document.documentElement.style.setProperty('--z',view.z);
  const g=20*view.z;
  ws.style.backgroundSize=`${g}px ${g}px`;ws.style.backgroundPosition=`${view.x}px ${view.y}px`;
  $('#zoomlbl').textContent=Math.round(view.z*100)+'%';
  if(sel.size===1&&Math.abs(view.z/selZ-1)>.15)renderSel();
}
let animId=0;
function animateView(t,dur=420){
  cancelAnimationFrame(animId);
  const s={...view},t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,4);
    view.x=s.x+(t.x-s.x)*e;view.y=s.y+(t.y-s.y)*e;view.z=s.z+(t.z-s.z)*e;applyView();
    if(k<1)animId=requestAnimationFrame(step)};
  animId=requestAnimationFrame(step);
}
function viewportRect(){
  const L=document.body.classList.contains('no-lib')?10:$('#lib').offsetWidth+20, Rr=document.body.classList.contains('no-insp')?10:$('#insp').offsetWidth+20;
  return {x:L,y:66,w:Math.max(200,innerWidth-L-Rr),h:Math.max(160,innerHeight-66-112)};
}
function fitView(anim=true){
  const r=viewportRect(),W=doc.project.width,H=pg().height;
  const zw=(r.w-64)/W, zh=(r.h-56)/H;
  let z=Math.min(zw,1); if(zh<z&&zh>=.3)z=zh; z=Math.max(z,.08);
  const t={z,x:r.x+(r.w-W*z)/2,y:H*z<r.h-56?r.y+(r.h-H*z)/2+8:r.y+40};
  anim?animateView(t):(Object.assign(view,t),applyView());
  layoutPreview();
}
function zoomAt(sx,sy,nz){nz=clamp(nz,.08,4);const w=toWorld(sx,sy);view.x=sx-w.x*nz;view.y=sy-w.y*nz;view.z=nz;applyView()}
function zoomBy(f){const r=viewportRect(),cx=r.x+r.w/2,cy=r.y+r.h/2,nz=clamp(view.z*f,.08,4),w=toWorld(cx,cy);animateView({z:nz,x:cx-w.x*nz,y:cy-w.y*nz},300)}

  return `<div class="sec"><div class="sec-h">第 ${cur+1} 页 · ${esc(p.title||'未命名页面')}</div><span class="pill${has?' ok':''}">${has?'已生成网页':'还没生成，现在显示线框'}</span></div>
  <div class="sec"><div class="sec-h">让 AI 修改这一页</div>
    <textarea class="fld" id="pv-instr" rows="3" placeholder="例如：整体换成深色科技风，标题更大，加上入场动画"></textarea>
    <div class="brow"><button class="pbtn" data-pv="edit"${has?'':' disabled'}>${ic('sparkle')}修改本页</button><button class="gbtn" data-pv="gen">${has?'重新生成':'生成本页'}</button></div></div>
  <div class="sec"><div class="brow" style="margin:0"><button class="gbtn" data-pv="undo"${partHist[p.id]&&partHist[p.id].length?'':' disabled'}>${ic('undo')}撤销上次修改</button><button class="gbtn" data-pv="open">${ic('ext')}浏览器打开</button></div></div>
  <div class="sec tips"><div class="sec-h">怎么用</div><ul>

    <li>回到<b>设计</b>改布局后，点“重新生成”</li>
    <li><kbd>⌘↩</kbd> 从本页开始播放</li>
  </ul></div>`;
}
function autosize(t){t.style.height='auto';t.style.height=t.scrollHeight+2+'px'}
function target(root){return root==='page'?pg():root==='project'?doc.project:byId([...sel][0])}
function setPath(path,val){
  const ks=path.split('.'), root=ks.shift();
  let o=target(root); if(!o)return;
  for(let i=0;i<ks.length-1;i++)o=o[ks[i]];
  o[ks[ks.length-1]]=val;
}
function renderInspector(){
  const box=$('#insp-body'), n=sel.size;
  box.innerHTML=mode==='preview'?previewInsp():n===0?pageInsp():n===1?modInsp(byId([...sel][0])):multiInsp(n);
  box.querySelectorAll('[data-bind]').forEach(inp=>{
    let pending=null;
    inp.addEventListener('focus',()=>{pending=snapshot()});
    inp.addEventListener('input',()=>{
      const b=inp.dataset.bind;let v=inp.value;
      if(inp.hasAttribute('data-num')){v=parseFloat(v);if(!isFinite(v))return;if(/\.(w|h|width|height)$/.test(b))v=Math.max(/^(page|project)/.test(b)?100:1,v)}
      if(pending){pushUndo(pending);pending=null}
      setPath(b,v);
      if(b==='project.width'){doc.project.device=Object.keys(DEV).find(k=>DEV[k].w===v&&DEV[k].h===doc.project.height)||'custom'}
      if(inp.tagName==='TEXTAREA')autosize(inp);
      render();scheduleSave();
    });
  });
  box.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));
  box.querySelectorAll('[data-pv]').forEach(b=>b.addEventListener('click',()=>pvAct(b.dataset.pv)));
  const ds=$('#devsel');if(ds)ds.addEventListener('change',()=>setDevice(ds.value));
  requestAnimationFrame(()=>box.querySelectorAll('textarea').forEach(autosize));
}
function updateGeom(){
  const m=sel.size===1&&byId([...sel][0]);
  if(m)document.querySelectorAll('#insp-body [data-geo]').forEach(i=>{if(document.activeElement!==i)i.value=Math.round(m[i.dataset.geo])});
  const ph=document.querySelector('#insp-body [data-bind="page.height"]');
  if(ph&&document.activeElement!==ph)ph.value=pg().height;
}

/* ================= 模块操作 ================= */
function autoGrow(){if(doc.project.device==='slide')return;const b=mods().reduce((a,m)=>Math.max(a,m.y+m.h),0);if(b>pg().height)pg().height=Math.ceil(b+40)}
const blankNotes=()=>({content:'',function:'',effect:''});
function addModule(type,x,y){
  checkpoint();
  const W=doc.project.width,[w,h]=T[type].s(W);
  if(x==null){
    const r=viewportRect(),c=toWorld(r.x+r.w/2,r.y+r.h/2);
    x=w>=W?0:clamp(c.x-w/2,0,Math.max(0,W-w));
    y=type==='nav'?0:type==='tabbar'?pg().height-h:clamp(c.y-h/2,0,Math.max(0,pg().height-h));
    x=Math.round(x);y=Math.round(y);
    while(mods().some(m=>m.x===x&&m.y===y)){x+=16;y+=16}
  }else if(w>=W*.98)x=0;
  const m={id:uid(),no:++doc.seq,type,name:T[type].n,x:Math.round(x),y:Math.round(y),w,h,text:'',notes:blankNotes()};
  mods().push(m);popIds.add(m.id);sel=new Set([m.id]);autoGrow();changed();
}
function delSel(){if(!sel.size)return;checkpoint();pg().modules=mods().filter(m=>!sel.has(m.id));sel.clear();changed()}
function cloneMods(ms,off){return ms.map(m=>{const c=JSON.parse(JSON.stringify(m));c.id=uid();c.no=++doc.seq;c.x+=off;c.y+=off;popIds.add(c.id);return c})}
function copySel(){if(!sel.size)return;clip=JSON.parse(JSON.stringify(selMods()));pasteN=0;toast(`已拷贝 ${clip.length} 个模块`)}
function paste(){if(!clip.length)return;checkpoint();pasteN++;const cs=cloneMods(clip,16*pasteN);mods().push(...cs);sel=new Set(cs.map(c=>c.id));autoGrow();changed()}
function dup(){if(!sel.size)return;checkpoint();const cs=cloneMods(selMods(),16);mods().push(...cs);sel=new Set(cs.map(c=>c.id));autoGrow();changed()}
function zorder(k){
  if(!sel.size)return;checkpoint();const a=mods(),s=m=>sel.has(m.id);
  if(k==='front')pg().modules=[...a.filter(m=>!s(m)),...a.filter(s)];
  else if(k==='back')pg().modules=[...a.filter(s),...a.filter(m=>!s(m))];
  else if(k==='fwd'){for(let i=a.length-2;i>=0;i--)if(s(a[i])&&!s(a[i+1]))[a[i],a[i+1]]=[a[i+1],a[i]]}
  else for(let i=1;i<a.length;i++)if(s(a[i])&&!s(a[i-1]))[a[i],a[i-1]]=[a[i-1],a[i]];
  changed();
}
function align(k){
  const ms=selMods();if(!ms.length)return;checkpoint();
  const b=ms.length===1?{x:0,y:0,w:doc.project.width,h:pg().height}:bbox(ms);
  ms.forEach(m=>{
    if(k==='l')m.x=b.x;if(k==='c')m.x=Math.round(b.x+b.w/2-m.w/2);if(k==='r')m.x=b.x+b.w-m.w;
    if(k==='t')m.y=b.y;if(k==='m')m.y=Math.round(b.y+b.h/2-m.h/2);if(k==='b')m.y=b.y+b.h-m.h;
  });
  changed();
}
function distribute(k){
  const ms=selMods();if(ms.length<3)return;checkpoint();
  const [p,s]=k==='h'?['x','w']:['y','h'];
  ms.sort((a,b)=>a[p]-b[p]);
  const first=ms[0],last=ms[ms.length-1];
  const gap=(last[p]+last[s]-first[p]-ms.reduce((a,m)=>a+m[s],0))/(ms.length-1);
  let c=first[p];ms.forEach(m=>{m[p]=Math.round(c);c+=m[s]+gap});
  changed();
}
function act(a){
  if(a==='delete')delSel();
  else if(a==='ai-notes')aiNotes();
  else if(a.startsWith('al-'))align(a.slice(3));
  else if(a.startsWith('dist-'))distribute(a.slice(5));
  else zorder(a);
}
function setDevice(k){
  const d=DEV[k];if(!d||doc.project.device===k)return;
  checkpoint();
  const oW=doc.project.width,f=d.w/oW;
  doc.pages.forEach(p=>{
    p.modules.forEach(m=>{
      if(m.w>=oW*.6){m.x=Math.round(m.x*f);m.w=Math.round(m.w*f)}
      else{const cx=(m.x+m.w/2)*f;m.x=Math.round(cx-m.w/2)}
    });
    if(k==='slide'||!p.modules.length)p.height=d.h;
  });
  Object.assign(doc.project,{width:d.w,height:d.h,device:k});
  autoGrow();changed();fitView();
  if(doc.pages.some(p=>p.modules.length))toast(`已切换到${d.n}，模块已按比例调整 · ⌘Z 可撤销`);
}
function focusNote(){
  if(sel.size!==1)return;
  const closed=document.body.classList.contains('no-insp');
  document.body.classList.remove('no-insp');
  const go=()=>{const t=document.querySelector('#insp-body [data-bind="m.notes.content"]');t&&t.focus()};
  closed?setTimeout(go,120):go();
}

/* ================= 页面操作 ================= */
function goPage(i){
  if(i<0||i>=doc.pages.length)return;
  const oH=pg()?pg().height:0,changedPage=i!==cur;
  cur=i;sel.clear();
  if(changedPage){clearEls();artboard.classList.remove('swap');void artboard.offsetWidth;artboard.classList.add('swap')}
  refresh();
  if(pg().height!==oH)fitView();
  const t=document.querySelector(`.pthumb[data-i="${i}"]`);t&&t.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  if(mode==='preview')loadPreview();
}
function addPage(at=cur+1,page){
  checkpoint();
  doc.pages.splice(at,0,page||newPage(`第 ${doc.pages.length+1} 页`));
  scheduleSave();goPage(at);
}
function dupPage(i){
  const src=doc.pages[i],p=JSON.parse(JSON.stringify(src));
  p.id=pid();p.title=src.title+' 副本';p.modules.forEach(m=>{m.id=uid();m.no=++doc.seq});
  if(parts[src.id]){parts[p.id]=parts[src.id].split(src.id).join(p.id);savePart(p.id)}
  addPage(i+1,p);
}
function delPage(i){
  if(doc.pages.length<2){toast('至少要保留一页');return}
  checkpoint();const [p]=doc.pages.splice(i,1);
  if(parts[p.id]){delete parts[p.id];fetch('/api/part',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:p.id,html:null})}).catch(()=>{});scheduleDeck()}
  cur=-1;scheduleSave();goPage(Math.min(i,doc.pages.length-1));
}

/* ================= 吸附 ================= */
function snapTargets(excl){
  const W=doc.project.width,H=pg().height,xs=[0,W/2,W],ys=[0];
  if(doc.project.device==='slide')ys.push(H/2,H);
  mods().forEach(m=>{if(!excl.has(m.id)){xs.push(m.x,m.x+m.w/2,m.x+m.w);ys.push(m.y,m.y+m.h/2,m.y+m.h)}});
  return {xs,ys};
}
function nearest(srcs,tgts,thr){let b=null;for(const s of srcs)for(const t of tgts){const d=t-s;if(Math.abs(d)<=thr&&(!b||Math.abs(d)<Math.abs(b)))b=d}return b}
function drawGuides(box,T2){
  const g=$('#guides'),W=doc.project.width,H=pg().height,lw=1/view.z;let h='';
  const vx=new Set(),hy=new Set();
  for(const t of T2.xs)for(const s of [box.x,box.x+box.w/2,box.x+box.w])if(Math.abs(t-s)<.5)vx.add(t);
  for(const t of T2.ys)for(const s of [box.y,box.y+box.h/2,box.y+box.h])if(Math.abs(t-s)<.5)hy.add(t);
  vx.forEach(x=>{const y1=Math.min(0,box.y),y2=Math.max(H,box.y+box.h);h+=`<i class="guide" style="left:${x-lw/2}px;top:${y1}px;width:${lw}px;height:${y2-y1}px"></i>`});
  hy.forEach(y=>{const x1=Math.min(0,box.x),x2=Math.max(W,box.x+box.w);h+=`<i class="guide" style="top:${y-lw/2}px;left:${x1}px;height:${lw}px;width:${x2-x1}px"></i>`});
  g.innerHTML=h;
}
const clearGuides=()=>{$('#guides').innerHTML=''};

/* ================= 画布交互 ================= */
ws.addEventListener('pointerdown',e=>{
  if(e.target.closest('.inline-ed'))return;
  hideMenu();
  const ae=document.activeElement;if(ae&&ae!==document.body)ae.blur();
  cancelAnimationFrame(animId);
  if(e.button===1||(e.button===0&&spaceDown)){
    viewTouched=true;
    drag={kind:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};ws.classList.add('panning');
    ws.setPointerCapture(e.pointerId);return;
  }
  if(e.button!==0)return;
  const h=e.target.closest('.handle');
  if(h&&sel.size===1){
    const m=byId([...sel][0]);
    drag={kind:'resize',d:h.dataset.d,m,o:{x:m.x,y:m.y,w:m.w,h:m.h},sx:e.clientX,sy:e.clientY,moved:false};
  }else if(e.target.closest('#hhandle')){
    drag={kind:'height',sx:e.clientX,sy:e.clientY,oh:pg().height,moved:false};
  }else{
    const mel=e.target.closest('.m');
    if(mel&&els.get(mel.dataset.id)===mel){
      const id=mel.dataset.id,was=sel.has(id);
      if(e.shiftKey){if(was){sel.delete(id);selChanged();return}sel.add(id)}
      else if(!was)sel=new Set([id]);
      selChanged();
      drag={kind:'move',sx:e.clientX,sy:e.clientY,id,was,shift:e.shiftKey,alt:e.altKey,moved:false,orig:selMods().map(m=>({m,x:m.x,y:m.y}))};
    }else{
      const base=e.shiftKey?new Set(sel):new Set();
      if(!e.shiftKey&&sel.size){sel.clear();selChanged()}
      drag={kind:'marq',sx:e.clientX,sy:e.clientY,base,moved:false};
    }
  }
  ws.setPointerCapture(e.pointerId);
});
ws.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dxs=e.clientX-drag.sx,dys=e.clientY-drag.sy;
  if(drag.kind==='pan'){view.x=drag.vx+dxs;view.y=drag.vy+dys;applyView();return}
  if(!drag.moved){
    if(Math.hypot(dxs,dys)<3)return;
    drag.moved=true;
    if(drag.kind!=='marq'){checkpoint();document.body.classList.add('dragging')}
    if(drag.kind==='move'&&drag.alt){
      const cs=cloneMods(drag.orig.map(o=>o.m),0);mods().push(...cs);sel=new Set(cs.map(c=>c.id));
      drag.orig=cs.map(m=>({m,x:m.x,y:m.y}));renderCanvas();
    }
  }
  const dx=dxs/view.z,dy=dys/view.z,thr=6/view.z;
  if(drag.kind==='move'){
    const ms=drag.orig.map(o=>o.m),b0=bbox(drag.orig.map(o=>({x:o.x,y:o.y,w:o.m.w,h:o.m.h})));
    const b={...b0,x:b0.x+dx,y:b0.y+dy};
    let ax=0,ay=0,T2=null;
    if(!e.metaKey){
      T2=snapTargets(sel);
      ax=nearest([b.x,b.x+b.w/2,b.x+b.w],T2.xs,thr)||0;
      ay=nearest([b.y,b.y+b.h/2,b.y+b.h],T2.ys,thr)||0;
    }
    drag.orig.forEach(o=>{o.m.x=Math.round(o.x+dx+ax);o.m.y=Math.round(o.y+dy+ay)});
    posEls(ms);renderSel();updateGeom();
    T2?drawGuides(bbox(ms),T2):clearGuides();
  }else if(drag.kind==='resize'){
    const {m,o,d}=drag;let x=o.x,y=o.y,w=o.w,h=o.h;
    if(d.includes('e'))w=o.w+dx; if(d.includes('w')){x=o.x+dx;w=o.w-dx}
    if(d.includes('s'))h=o.h+dy; if(d.includes('n')){y=o.y+dy;h=o.h-dy}
    if(e.shiftKey&&d.length===2){const r=o.w/o.h;if(Math.abs(w/o.w)>Math.abs(h/o.h))h=w/r;else w=h*r;if(d.includes('w'))x=o.x+o.w-w;if(d.includes('n'))y=o.y+o.h-h}
    let T2=null;
    if(!e.metaKey&&!e.shiftKey){
      T2=snapTargets(sel);
      if(d.includes('e')){const s=nearest([x+w],T2.xs,thr);if(s)w+=s}
      if(d.includes('w')){const s=nearest([x],T2.xs,thr);if(s){x+=s;w-=s}}
      if(d.includes('s')){const s=nearest([y+h],T2.ys,thr);if(s)h+=s}
      if(d.includes('n')){const s=nearest([y],T2.ys,thr);if(s){y+=s;h-=s}}
    }
    if(w<8){if(d.includes('w'))x=o.x+o.w-8;w=8}
    if(h<8){if(d.includes('n'))y=o.y+o.h-8;h=8}
    Object.assign(m,{x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)});
    posEls([m]);renderSel();updateGeom();
    T2?drawGuides(m,T2):clearGuides();
  }else if(drag.kind==='height'){
    pg().height=Math.max(200,Math.round(drag.oh+dy));
    renderCanvas();updateGeom();
  }else if(drag.kind==='marq'){
    const x1=Math.min(e.clientX,drag.sx),y1=Math.min(e.clientY,drag.sy),x2=Math.max(e.clientX,drag.sx),y2=Math.max(e.clientY,drag.sy);
    Object.assign($('#marquee').style,{display:'block',left:x1+'px',top:y1+'px',width:x2-x1+'px',height:y2-y1+'px'});
    const a=toWorld(x1,y1),b=toWorld(x2,y2);
    sel=new Set(drag.base);
    mods().forEach(m=>{if(m.x<b.x&&m.x+m.w>a.x&&m.y<b.y&&m.y+m.h>a.y)sel.add(m.id)});
    els.forEach((el,id)=>el.classList.toggle('sel',sel.has(id)));renderSel();
  }
});
function endDrag(){
  if(!drag)return;
  const d=drag;drag=null;
  ws.classList.remove('panning');document.body.classList.remove('dragging');clearGuides();
  $('#marquee').style.display='none';
  if(d.kind==='move'){
    if(d.moved){autoGrow();changed()}
    else if(d.was&&!d.shift&&sel.size>1){sel=new Set([d.id]);selChanged()}
  }else if(d.kind==='resize'||d.kind==='height'){if(d.moved)changed()}
  else if(d.kind==='marq'&&d.moved)selChanged();
}
ws.addEventListener('pointerup',endDrag);
ws.addEventListener('pointercancel',endDrag);
ws.addEventListener('dblclick',e=>{
  const t=document.elementFromPoint(e.clientX,e.clientY),mel=t&&t.closest('.m');
  if(!mel||els.get(mel.dataset.id)!==mel||t.closest('.inline-ed'))return;
  const m=byId(mel.dataset.id);
  sel=new Set([m.id]);selChanged();
  TEXTY.has(m.type)?startInline(m):focusNote();
});
ws.addEventListener('wheel',e=>{
  e.preventDefault();cancelAnimationFrame(animId);viewTouched=true;
  if(e.ctrlKey)zoomAt(e.clientX,e.clientY,view.z*Math.exp(-clamp(e.deltaY,-40,40)*.012));
  else{view.x-=e.deltaX;view.y-=e.deltaY;applyView()}
},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
let gz=1;
ws.addEventListener('gesturestart',e=>{e.preventDefault();gz=view.z});
ws.addEventListener('gesturechange',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,gz*e.scale)});

/* 在画布上直接改文字 */
function startInline(m){
  const el=els.get(m.id);if(!el)return;
  const body=el.firstChild,cls=m.type==='input'||m.type==='search'?m.type:m.type;
  const ed=document.createElement('div');
  ed.className=`tx tx-${cls} inline-ed`;ed.contentEditable='plaintext-only';
  ed.textContent=m.text||(m.type==='button'||m.type==='box'?m.name:'');
  el.classList.add('editing');body.innerHTML='';body.appendChild(ed);
  ed.focus();
  const r=document.createRange();r.selectNodeContents(ed);const s=getSelection();s.removeAllRanges();s.addRange(r);
  const before=snapshot();let dirty=false;
  ed.addEventListener('input',()=>{
    if(!dirty){pushUndo(before);dirty=true}
    m.text=ed.innerText.replace(/\n$/,'');
    const t=document.querySelector('#insp-body [data-bind="m.text"]');if(t&&t!==document.activeElement){t.value=m.text;autosize(t)}
    renderStrip();scheduleSave();
  });
  ed.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Escape'||(e.key==='Enter'&&(e.metaKey||e.ctrlKey))){e.preventDefault();ed.blur()}
  });
  ed.addEventListener('blur',()=>{el.classList.remove('editing');el._k=null;renderCanvas();renderLayers()},{once:true});
}

/* 右键菜单 */
let menuEl=null;
function hideMenu(){if(menuEl){menuEl.remove();menuEl=null}}
function showMenu(x,y,items){
  hideMenu();menuEl=document.createElement('div');menuEl.className='menu glass';
  menuEl.innerHTML=items.map((it,i)=>it==='-'?'<div class="msep"></div>':`<div class="mi${it[3]?' dis':''}${it[4]?' red':''}" data-i="${i}"><span>${it[0]}</span><span class="k">${it[1]}</span></div>`).join('');
  document.body.appendChild(menuEl);
  const r=menuEl.getBoundingClientRect();
  menuEl.style.left=Math.min(x,innerWidth-r.width-8)+'px';menuEl.style.top=Math.min(y,innerHeight-r.height-8)+'px';
  menuEl.addEventListener('pointerdown',e=>e.stopPropagation());
  menuEl.addEventListener('click',e=>{const mi=e.target.closest('.mi');if(!mi)return;const it=items[mi.dataset.i];hideMenu();it[2]()});
}
ws.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const mel=e.target.closest('.m');
  if(mel&&els.get(mel.dataset.id)===mel){
    if(!sel.has(mel.dataset.id)){sel=new Set([mel.dataset.id]);selChanged()}
    const m=sel.size===1&&byId([...sel][0]);
    showMenu(e.clientX,e.clientY,[

let lastNudge=0;
document.addEventListener('keydown',e=>{
  const typing=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]');
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(mod&&k==='k'){e.preventDefault();openPalette();return}
  if(mod&&e.key==='Enter'&&!typing){e.preventDefault();play();return}
  if(e.key==='Escape'&&$('.sheet')){closeSheets();return}
  if(mod&&k==='z'){if(typing)return;e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k==='y'&&!typing){e.preventDefault();redo();return}
  if(typing){if(e.key==='Escape'||(e.key==='Enter'&&e.target.tagName==='INPUT'&&!e.target.closest('.sheet,#fbar')))e.target.blur();return}
  if(e.key==='PageDown'){e.preventDefault();goPage(cur+1);return}
  if(e.key==='PageUp'){e.preventDefault();goPage(cur-1);return}
  if(mode==='preview'){if(e.key==='Escape')pvSelect(null);return}
  if(e.code==='Space'){e.preventDefault();if(!spaceDown){spaceDown=true;ws.classList.add('space')}return}
  if(mod&&(k==='='||k==='+')){e.preventDefault();zoomBy(1.25);return}
  if(mod&&k==='-'){e.preventDefault();zoomBy(.8);return}
  if(mod&&k==='0'){e.preventDefault();fitView();return}
  if(mod&&k==='1'){e.preventDefault();zoomBy(1/view.z);return}
  if(mod&&k==='a'){e.preventDefault();selectAll();return}
  if(mod&&k==='c'){e.preventDefault();copySel();return}
  if(mod&&k==='x'){e.preventDefault();copySel();delSel();return}
  if(mod&&k==='v'){e.preventDefault();paste();return}
  if(mod&&k==='d'){e.preventDefault();dup();return}
  if(mod&&e.code==='BracketRight'){e.preventDefault();zorder(e.shiftKey?'front':'fwd');return}
  if(mod&&e.code==='BracketLeft'){e.preventDefault();zorder(e.shiftKey?'back':'bwd');return}
  if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();delSel();return}
  if(e.key==='Escape'){hideMenu();if(sel.size){sel.clear();selChanged()}return}
  if(e.key==='Enter'&&sel.size===1){e.preventDefault();const m=byId([...sel][0]);TEXTY.has(m.type)?startInline(m):focusNote();return}
  const arrows={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(arrows[e.key]&&sel.size){
    e.preventDefault();const n=e.shiftKey?10:1,[ax,ay]=arrows[e.key];
    if(Date.now()-lastNudge>800)checkpoint();lastNudge=Date.now();
    selMods().forEach(m=>{m.x+=ax*n;m.y+=ay*n});
    posEls(selMods());renderSel();updateGeom();scheduleSave();
  }
});

      const type=tile.dataset.type,[w,h]=T[type].s(doc.project.width);
      let ghost=null,prev=null,moved=false;
      const move=ev=>{
        if(!moved&&Math.hypot(ev.clientX-e.clientX,ev.clientY-e.clientY)<4)return;
        if(!moved){moved=true;ghost=document.createElement('div');ghost.className='ghost glass';ghost.innerHTML=ic(type)+`<span>${T[type].n}</span>`;document.body.appendChild(ghost)}
        ghost.style.left=ev.clientX+14+'px';ghost.style.top=ev.clientY+10+'px';
        const over=document.elementFromPoint(ev.clientX,ev.clientY),onWs=over&&(over===ws||ws.contains(over));
        if(onWs){
          if(!prev){prev=document.createElement('div');prev.className='drop-prev';$('#overlay').appendChild(prev)}
          const p=toWorld(ev.clientX,ev.clientY),x=w>=doc.project.width*.98?0:p.x-w/2;

        }else if(prev)prev.style.opacity=0;
      };
      const up=ev=>{
        tile._busy=false;
        tile.removeEventListener('pointermove',move);tile.removeEventListener('pointerup',up);tile.removeEventListener('pointercancel',up);
        const onWs=prev&&prev.style.opacity!=='0';
        if(ghost){ghost.style.transition='opacity .2s,transform .2s';ghost.style.opacity=0;ghost.style.transform='scale(.8)';setTimeout(()=>ghost.remove(),200)}
        if(prev)prev.remove();
        if(!moved)addModule(type);
        else if(onWs){const p=toWorld(ev.clientX,ev.clientY);addModule(type,p.x-w/2,p.y-h/2)}
      };
      tile.addEventListener('pointermove',move);tile.addEventListener('pointerup',up);tile.addEventListener('pointercancel',up);
    });
  });
}

async function ai({messages,json=false,stream=false,max_tokens,onDelta}){
  aiCtl=new AbortController();
  const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},signal:aiCtl.signal,body:JSON.stringify({messages,json,stream,max_tokens,temperature:json?.7:.8})});
  if(!r.ok){let msg='HTTP '+r.status;try{msg=(await r.json()).error||msg}catch{}throw new Error(msg)}
  if(!stream){const j=await r.json();return j.choices?.[0]?.message?.content||''}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',out='';
  for(;;){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue;const d=line.slice(5).trim();if(d==='[DONE]')continue;
      try{const c=JSON.parse(d).choices?.[0]?.delta?.content;if(c){out+=c;onDelta&&onDelta(out)}}catch{}
    }
  }
  return out;
}

const genRules=(id,W,H)=>`你是顶尖的演示/网页设计师兼前端工程师。把用户给的一页线框图做成精美、可以直接展示的 HTML。必须遵守：
1. 只输出 HTML 片段本身：不要 markdown 代码块，不要 <!doctype>、<html>、<head>、<body>，不要任何解释。
2. 片段会被放进 <section data-pid="${id}">，这个 section 宽 ${W}px、高 ${H}px，已经是定位容器且 overflow:hidden。按这个尺寸排版；线框里模块的位置和大小是布局依据，可以优化细节，但整体结构保持一致。
3. CSS 全部写在片段开头的一个 <style> 里，每个选择器都必须以 [data-pid="${id}"] 开头，禁止写不带前缀的全局选择器（如 body、*、h1）。
4. 所有可见文字直接写在 HTML 标签里，不要用 JavaScript 生成或修改文字（用户之后要直接点文字修改）。模块的 text 是用户指定的原文，原样使用；没有 text 的，按备注写真实具体的内容，不要 lorem ipsum。
5. 备注里的“内容/功能/效果”是硬性需求，逐条实现。
6. 图片用 https://picsum.photos/seed/英文关键词/宽/高 ，图标用内联 SVG 或 emoji；除 Google Fonts 的 @import 外，不要引用外部 JS/CSS。
7. 翻到这一页时，外壳会给 section 加上 class "active"。入场动画写成 [data-pid="${id}"].active .xxx { animation: … }，这样每次翻到都会播放。
8. 需要交互（点击切换、弹窗等）可以在末尾放一个 <script>，用 const root=document.currentScript.closest('[data-pid]'); 只操作 root 里的元素。可点击的元素请用 button 或加 data-nopage 属性，这样点它不会触发翻页。`;
function styleRef(exceptId){
  const k=doc.pages.map(p=>p.id).find(id=>id!==exceptId&&parts[id]);if(!k)return '';
  const m=parts[k].match(/<style[\s\S]*?<\/style>/i);
  return m?`\n为了整套风格统一，请参考已生成页面的样式（选择器前缀不同，照搬风格即可）：\n${m[0].slice(0,4000)}`:'';
}
async function genPage(i,extra,label){
  const p=doc.pages[i],W=doc.project.width,H=p.height;
  const out=await ai({stream:true,max_tokens:8000,onDelta:s=>busyText(`${label} · 已写 ${s.length} 字`),messages:[
    {role:'system',content:genRules(p.id,W,H)},
    {role:'user',content:`项目：${doc.project.title}（共 ${doc.pages.length} 页，这是第 ${i+1} 页「${p.title}」）
项目整体说明：${doc.project.notes||'无'}
本页说明：${p.notes||'无'}
本页线框（坐标单位 px，modules 按层级从下到上，inside 表示被哪个编号的模块包含）：
${JSON.stringify(exportPage(p).modules)}${styleRef(p.id)}
${extra?'额外要求：'+extra:''}`}]});
  const html=stripFence(out);
  if(!/<[a-z]/i.test(html))throw new Error('模型没有返回 HTML');
  pushPartHist(p.id,true);parts[p.id]=html;await savePart(p.id);
}
async function genPages(idx,extra=''){
  await withAI('AI 正在生成网页…',async()=>{
    for(let n=0;n<idx.length;n++){
      const label=idx.length>1?`正在生成第 ${n+1}/${idx.length} 页`:'正在生成网页';
      busyText(label);await genPage(idx[n],extra,label);renderStrip();
    }
    await saveDeck();
    toast(idx.length>1?`${idx.length} 页都生成好了`:'生成好了');
    if(mode==='preview')loadPreview();else setMode('preview');
  });
}
async function aiEditPage(instr){
  const p=pg();if(!parts[p.id]||!instr)return;
  await withAI('AI 正在修改这一页…',async()=>{
    const out=await ai({stream:true,max_tokens:8000,onDelta:s=>busyText(`正在修改 · 已写 ${s.length} 字`),messages:[
      {role:'system',content:genRules(p.id,doc.project.width,p.height)+'\n现在是修改一个已有的页面：在现有代码基础上按要求修改，没提到的部分保持不变，输出修改后的完整片段。'},
      {role:'user',content:`现有片段：\n${parts[p.id]}\n\n修改要求：${instr}`}]});
    const html=stripFence(out);if(!/<[a-z]/i.test(html))throw new Error('模型没有返回 HTML');
    pushPartHist(p.id,true);parts[p.id]=html;await savePart(p.id);await saveDeck();loadPreview();toast('改好了 · 可以“撤销上次修改”');
  });
}
async function aiEditElement(instr){
  const p=pg(),src=parts[p.id];if(!pvSel||!src||!instr)return;
  const tpl=document.createElement('template');tpl.innerHTML=src;
  const tgt=srcNode(tpl,pvSel);
  if(!tgt){toast('找不到这个元素的源码，试试在右边“修改本页”里描述');return}
  await withAI('AI 正在修改选中的元素…',async()=>{
    const style=(src.match(/<style[\s\S]*?<\/style>/i)||[''])[0].slice(0,6000);
    const out=await ai({json:true,max_tokens:4000,messages:[
      {role:'system',content:`你在修改一页 HTML 中的一个元素。CSS 选择器必须以 [data-pid="${p.id}"] 开头。文字直接写在标签里，不要用 JS 生成。只输出 JSON。`},
      {role:'user',content:`本页的样式：\n${style}\n\n要修改的元素：\n${tgt.outerHTML.slice(0,8000)}\n\n修改要求：${instr}\n\n输出 JSON：{"html":"替换后的这个元素的完整 HTML","css":"需要追加到本页样式里的 CSS（没有就空字符串）"}`}]});
    const j=parseJSON(out);if(!j.html)throw new Error('模型没有返回 HTML');
    const f=document.createElement('template');f.innerHTML=String(j.html);tgt.replaceWith(f.content);
    if(j.css){let st=tpl.content.querySelector('style');if(!st){st=document.createElement('style');tpl.content.prepend(st)}st.textContent+='\n'+j.css}
    pushPartHist(p.id,true);parts[p.id]=tpl.innerHTML;await savePart(p.id);await saveDeck();loadPreview();toast('改好了 · 可以“撤销上次修改”');
  });
}

function pushPartHist(id,force){

  if(!force&&h._t&&Date.now()-h._t<3000)return;

const DECK_CSS=`*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b0c;overflow:hidden;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}

.wf-tag{position:absolute;right:12px;top:10px;font-size:12px;color:#8e8e93;background:rgba(120,120,128,.12);padding:3px 8px;border-radius:6px;z-index:99}
.wf-m{position:absolute;border-radius:8px;background:rgba(120,120,128,.1);box-shadow:inset 0 0 0 1px rgba(120,120,128,.3);padding:8px 10px;overflow:hidden;color:#6e6e73;font-size:13px;display:flex;flex-direction:column;gap:4px}

function deckRuntime(){
  var q=new URLSearchParams(location.search),embed=q.has('embed'),S=[].slice.call(document.querySelectorAll('.slide')),i=-1,st=document.getElementById('stage');
  if(embed){document.body.classList.add('embed');document.documentElement.style.background='transparent'}
  function fit(){
    var vw=innerWidth,vh=innerHeight,pad=embed?40:0;
    S.forEach(function(s){
      var W=parseFloat(s.style.width),H=parseFloat(s.style.height),tall=H>W*1.3;
      var k=tall?Math.min((vw-pad)/W,1):Math.min((vw-pad)/W,(vh-pad)/H);
      s.classList.toggle('tall',tall);
      s.style.setProperty('--base',tall?'translate(-50%,0) scale('+k+')':'translate(-50%,-50%) scale('+k+')');
      s.style.top=tall?(pad/2)+'px':'50%';
    });
  }
  function go(n,dir){
    n=Math.max(0,Math.min(S.length-1,n));if(n===i)return;
    if(i>=0)S[i].classList.remove('active','back');
    i=n;var s=S[i];s.classList.toggle('back',dir<0);s.classList.add('active');st.scrollTop=0;
    var pn=document.getElementById('pn');if(pn)pn.textContent=(i+1)+' / '+S.length;
    var bar=document.getElementById('bar');if(bar)bar.style.width=((i+1)/S.length*100)+'%';
    if(!embed)history.replaceState(null,'',location.pathname+location.search+'#'+(i+1));
    if(parent!==window)parent.postMessage({deck:'page',i:i},'*');
  }
  var start=0,p=q.get('p');
  if(p)S.forEach(function(s,k){if(s.getAttribute('data-pid')===p)start=k});
  else if(/^#\d+$/.test(location.hash))start=+location.hash.slice(1)-1;
  fit();go(start,1);addEventListener('resize',fit);
  if(embed||!S.length)return;
  function next(){go(i+1,1)} function prev(){go(i-1,-1)}
  addEventListener('keydown',function(e){
    var k=e.key,tall=S[i].classList.contains('tall');
    if(k==='ArrowRight'||k==='PageDown'||(!tall&&(k===' '||k==='ArrowDown'||k==='Enter'))){e.preventDefault();next()}
    else if(k==='ArrowLeft'||k==='PageUp'||(!tall&&(k==='ArrowUp'||k==='Backspace'))){e.preventDefault();prev()}
    else if(k==='Home')go(0,-1);else if(k==='End')go(S.length-1,1);
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
    else if(k==='Escape'&&parent!==window)parent.postMessage({deck:'exit'},'*');
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('a,button,input,textarea,select,label,video,[data-nopage],[onclick]'))return;
    if(String(getSelection()).length)return;
    e.clientX<innerWidth*.25?prev():next();
  });
}

let pvSel=null,pvRoot=null,pvDoc=null;
const SVGNS='http://www.w3.org/2000/svg';
const isTextBlock=e=>e.namespaceURI!==SVGNS&&!/^(SCRIPT|STYLE)$/.test(e.tagName)&&[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim());
function pick(el){
  if(!pvRoot||!el||el.nodeType!==1||!pvRoot.contains(el)||el===pvRoot)return null;
  const g=el.closest('svg');if(g&&pvRoot.contains(g))return g;
  for(let e=el;e&&e!==pvRoot;e=e.parentElement)if(isTextBlock(e))return e;
  return el;
}
function pathOf(el){const p=[];while(el&&el!==pvRoot){const par=el.parentElement;if(!par)return null;p.unshift([...par.children].indexOf(el));el=par}return el?p:null}
function nodeAt(root,p){let n=root;for(const i of p){n=n.children[i];if(!n)return null}return n}
const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
function srcNode(tpl,live,origText){
  const p=pathOf(live);let n=p&&nodeAt(tpl.content,p);
  const want=norm(origText??live.textContent);
  if(n&&n.tagName===live.tagName&&norm(n.textContent)===want)return n;
  return [...tpl.content.querySelectorAll(live.tagName)].find(x=>norm(x.textContent)===want)||null;
}
function cleanInner(el){
  const c=el.cloneNode(true);
  [c,...c.querySelectorAll('*')].forEach(x=>{x.removeAttribute('data-ed-hover');x.removeAttribute('data-ed-sel');x.removeAttribute('contenteditable')});
  return c.innerHTML;
}
const EDIT_CSS=`[data-ed-hover]{outline:2px dashed rgba(0,122,255,.55)!important;outline-offset:3px!important;cursor:pointer}
[data-ed-sel]{outline:2px solid #007AFF!important;outline-offset:3px!important}
[contenteditable]{cursor:text!important}`;
function hookPreview(){
  let d;try{d=$('#pvframe').contentDocument}catch{return}
  if(!d||!d.body)return;
  pvDoc=d;pvRoot=d.querySelector(`.slide[data-pid="${pg().id}"]`);pvSel=null;hookDrop(d);
  if(!pvRoot||!parts[pg().id])return;
  const st=d.createElement('style');st.textContent=EDIT_CSS;d.head.appendChild(st);
  let hov=null;
  d.addEventListener('mousemove',e=>{const t=pick(e.target);if(t!==hov){hov&&hov.removeAttribute('data-ed-hover');hov=t;t&&t!==pvSel&&t.setAttribute('data-ed-hover','')}});
  d.addEventListener('mouseleave',()=>{hov&&hov.removeAttribute('data-ed-hover');hov=null});
  d.addEventListener('click',e=>{
    const t=pick(e.target);
    if(!t){pvSelect(null);return}
    e.preventDefault();e.stopPropagation();
    if(t===pvSel&&t.isContentEditable)return;
    pvSelect(t);
    if(isTextBlock(t)){
      t._orig=t.textContent;t.contentEditable='plaintext-only';t.focus();

// 普通网页：样式加上 [data-pid] 前缀，html/body 换成 .pg-html/.pg-body 两层包装，图片等换成 assets/ 里的文件；
// 画板导出的整套页面：每个 section.slide 变成一页。导入后自动识别大致结构，生成画布上的线框。
const isLocal=u=>!!u&&!/^([a-z][\w+.-]*:|\/\/|#)/i.test(u.trim());
const baseName=u=>{const s=String(u).trim().split(/[?#]/)[0].split(/[\\/]/).pop()||'';try{return decodeURIComponent(s).toLowerCase()}catch{return s.toLowerCase()}};
const assetUrl=k=>'assets/'+encodeURIComponent(k);
const toHex=c=>{const m=/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/.exec(c||'');return !m||m[4]==='0'?null:'#'+m.slice(1,4).map(x=>(+x).toString(16).padStart(2,'0')).join('')};
const vhFix=s=>s.replace(/(^|[^\w.#-])(\d*\.?\d+)[dsl]?v([hw])\b/g,'$1calc($2 * var(--pg-v$3))');
const renameAnim=(s,frames,id)=>frames.length?s.replace(/(animation(?:-name)?\s*:)([^;}]*)/g,(m,a,v)=>a+v.replace(/[\w-]+/g,w=>frames.includes(w)?id+'-'+w:w)):s;
function splitSel(s){const o=[];let d=0,b='';for(const c of s){if(c==='('||c==='[')d++;else if(c===')'||c===']')d--;if(c===','&&!d){o.push(b);b=''}else b+=c}o.push(b);return o}
// 按宽度的 @media 改成 @container：预览框再小，也按页面本身的宽度排版
const cq=m=>{const qs=[...m].map(q=>q.trim().replace(/^(only\s+)?(screen|all)\s+and\s+/i,''));
  return qs.length&&qs.every(q=>!/device/i.test(q)&&/^\([^()]*\bwidth\b[^()]*\)(\s+and\s+\([^()]*\bwidth\b[^()]*\))*$/i.test(q))?qs.join(' or '):null};
function scopeCSS(css,id){
  const S=`[data-pid="${id}"]`,frames=[],sheet=new CSSStyleSheet();
  try{sheet.replaceSync(css)}catch{return {css:'',frames}}
  const sel=s=>splitSel(s).map(x=>S+' '+x.trim().replace(/:root(?![\w-])/gi,'.pg-html').replace(/(^|[\s>+~(,])html(?![\w-])/gi,'$1.pg-html').replace(/(^|[\s>+~(,])body(?![\w-])/gi,'$1.pg-body')).join(',');
  const walk=rules=>[...rules].map(r=>{
    if(r instanceof CSSStyleRule)return sel(r.selectorText)+' '+r.cssText.slice(r.cssText.indexOf('{'));
    if(r instanceof CSSMediaRule&&cq(r.media))return `@container pg ${cq(r.media)}{\n${walk(r.cssRules)}\n}`;
    if(r instanceof CSSKeyframesRule){frames.push(r.name);return `@keyframes ${CSS.escape(id+'-'+r.name)}{${[...r.cssRules].map(k=>k.cssText).join('')}}`}
    if(r.cssRules)return r.cssText.slice(0,r.cssText.indexOf('{'))+'{\n'+walk(r.cssRules)+'\n}';
    return r.cssText;
  }).join('\n');
  return {css:renameAnim(vhFix(walk(sheet.cssRules)),frames,id),frames};
}
async function fetchCss(h){
  try{
    const u=new URL(h,location.href),r=await fetch(u,{signal:AbortSignal.timeout(5000)});if(!r.ok)return null;
    return (await r.text()).replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g,(m,q,x)=>/^data:/i.test(x)?m:`url("${new URL(x,u).href}")`);
  }catch{return null}
}
async function uploadAsset(f){
  const name=f.name.toLowerCase().replace(/[\\/\x00]/g,'_').replace(/^\.+/,'');
  const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]||'');fr.readAsDataURL(f)});
  await fetch('/api/asset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,data})});
